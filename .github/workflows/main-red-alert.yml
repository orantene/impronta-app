# Red-main alarm.
#
# Vercel deploys every push to main REGARDLESS of CI — the structural gate
# runs in parallel with the deploy, so a red gate on main means production is
# already running (or about to run) unvetted code. On 2026-08-03 main sat red
# for ~1.5h (#978's type error) while three other lanes kept merging on top.
#
# This workflow makes that state impossible to miss: when the CI workflow
# completes with failure on a main push, it opens (or comments on) a pinned
# "MAIN IS RED" issue, and closes it automatically on the next green run.

name: Main red alert

on:
  workflow_run:
    # EVERY gate that runs on a main push belongs here. Watching only the
    # structural gate meant a red perf budget or a broken fidelity golden sat
    # on main with no alarm at all — which is exactly what happened on
    # 2026-08-28: two builder merges pushed the renderer stylesheet over budget
    # and left two type errors, main stayed red unnoticed, and three unrelated
    # PRs inherited the failure and looked like the culprits.
    workflows:
      - "CI — structural quality gate"
      - "Builder fidelity visual regression"
      - "CI — admin boot (prod build)"
    types: [completed]
    branches: [main]

permissions:
  issues: write

jobs:
  alert:
    name: Raise / clear the red-main issue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open, bump, or close the alarm issue
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const conclusion = run.conclusion; // success | failure | cancelled | ...
            const sha = run.head_sha.slice(0, 9);
            const runUrl = run.html_url;
            const TITLE = "🔴 MAIN IS RED — production exposure window open";

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "main-red",
              per_page: 1,
            });
            const existing = open[0];

            if (conclusion === "failure") {
              const body = [
                `\`${run.name}\` failed on \`main\` at \`${sha}\` — and Vercel deploys main pushes regardless of CI, so production may be running this commit right now.`,
                "",
                `Run: ${runUrl}`,
                "",
                "**Protocol** (see web/docs/development-workflow.md → “When main is red”):",
                "1. Fix forward or revert the breaking commit IMMEDIATELY — every open PR is also failing its ratchet against this.",
                "2. If production is misbehaving, roll back: `cd web && npm run deploy:promote -- <last-good-deploy-url>`.",
                "3. Do not merge anything unrelated until this closes.",
              ].join("\n");

              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: `Still red: \`${run.name}\` at \`${sha}\` — ${runUrl}`,
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: TITLE,
                  body,
                  labels: ["main-red"],
                });
              }
            } else if (conclusion === "success" && existing) {
              // With several gates watched, THIS one being green proves nothing
              // about the others. Closing on a single success would let a green
              // fidelity run clear an alarm the type gate raised, which is worse
              // than no alarm: it reads as "main recovered" when it did not.
              // So ask about every watched gate at this exact commit, and only
              // close when they all agree.
              const WATCHED = [
                "CI — structural quality gate",
                "Builder fidelity visual regression",
                "CI — admin boot (prod build)",
              ];
              const { data: shaRuns } = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head_sha: run.head_sha,
                per_page: 100,
              });

              // Newest run wins per workflow — a re-run should count, not the
              // original failure it replaced.
              const latest = new Map();
              for (const r of shaRuns.workflow_runs ?? []) {
                if (!WATCHED.includes(r.name)) continue;
                const prev = latest.get(r.name);
                if (!prev || new Date(r.created_at) > new Date(prev.created_at)) {
                  latest.set(r.name, r);
                }
              }

              const notGreen = WATCHED.filter((name) => {
                const r = latest.get(name);
                // A gate that has not reported at this commit is unknown, not
                // green. Silence is not evidence.
                return !r || r.conclusion !== "success";
              });

              if (notGreen.length > 0) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: `\`${run.name}\` is green at \`${sha}\`, but still waiting on: ${notGreen.map((n) => `\`${n}\``).join(", ")}. Leaving this open.`,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: `Main is green again at \`${sha}\` — every watched gate passed. ${runUrl}. Closing.`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  state: "closed",
                });
              }
            }
