name: Vercel post-deploy alias

# Re-aliases the two ghost-locked domains (tulala.digital, app.tulala.digital)
# PLUS every registered tenant subdomain (agency_domains, kind=subdomain, e.g.
# <slug>.tulala.digital) onto the latest successful production deployment.
#
# Neither category gets Vercel's autoAssignCustomDomains treatment: the ghost
# domains can't be attached at the project level (a deleted predecessor
# project still "owns" them — see .claude/.../memory/project_vercel_deployment.md
# "Ghost project alias workaround"), and tenant subdomains were created via
# one-off `vercel alias set` calls at provisioning time, so they're pinned to
# whatever deployment they last pointed at and silently go stale (Vercel
# DEPLOYMENT_NOT_FOUND) once that deployment is pruned. That staleness is what
# broke the workspace switcher for QA tenant subdomains in 2026-07 — this
# workflow now re-aliases all of them on every prod deploy so it can't recur.
#
# Fires on `deployment_status` — Vercel's GitHub App creates GitHub Deployments
# for every push, so this runs right after each prod deploy finishes.

on:
  deployment_status:

# ── Race fix (2026-07-11) ────────────────────────────────────────────────────
# When several PRs merge to `main` close together (common with multiple agents),
# each production deploy fires its own `deployment_status` event and its own run
# of this workflow. With no coordination those runs execute in PARALLEL and
# clobber each other: whichever run *finishes last* wins, which is NOT
# necessarily the newest deploy — so the domains drift onto a stale build and
# need a manual `vercel alias set`. This bit us repeatedly on 2026-07-11.
#
# Two defenses:
#  1. `concurrency` serializes runs (no parallel clobber). cancel-in-progress is
#     false so no run is dropped, each one re-asserts the alias in turn.
#  2. The step aliases to the QUERIED newest READY production deployment, not the
#     triggering event's target_url. This makes it order-independent and
#     self-healing: even a late/out-of-order run re-points the domains at the
#     true latest. target_url is only a fallback if the query returns empty.
concurrency:
  group: vercel-alias-production
  cancel-in-progress: false

jobs:
  alias:
    name: Re-alias ghost-locked + tenant domains
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Re-alias all registered domains
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          EVENT_URL: ${{ github.event.deployment_status.target_url }}
        run: |
          set -euo pipefail

          # Prefer the newest READY production deployment over the triggering
          # event's URL, so concurrent / out-of-order merges can't strand the
          # domains on a stale build. Fall back to the event URL if the query
          # yields nothing (e.g. a transient CLI hiccup).
          LATEST="$(
            vercel ls tulala \
              --scope oran-tenes-projects \
              --token "$VERCEL_TOKEN" \
              --prod 2>/dev/null \
            | grep -i 'ready' \
            | grep -oE 'https://tulala-[a-z0-9]+-oran-tenes-projects\.vercel\.app' \
            | head -1 || true
          )"

          DEPLOY_URL="${LATEST:-${EVENT_URL:-}}"
          if [[ -z "$DEPLOY_URL" ]]; then
            echo "::error::could not resolve a production deployment URL (no newest-ready, no event target_url)"
            exit 1
          fi

          if [[ -n "${LATEST:-}" && "$LATEST" != "${EVENT_URL:-}" ]]; then
            echo "::notice::event fired for ${EVENT_URL:-<none>} but newest-ready is $LATEST; aliasing to newest-ready"
          fi

          echo "Aliasing $DEPLOY_URL -> tulala.digital + app.tulala.digital + tenant subdomains"
          # vercel-post-deploy-alias.sh shells out to `vercel` with --scope but
          # no --token; the CLI picks up VERCEL_TOKEN from env. It also queries
          # Supabase (SUPABASE_ACCESS_TOKEN/SUPABASE_URL) for every registered
          # tenant subdomain and re-aliases those too — see the script's header.
          ./scripts/vercel-post-deploy-alias.sh "$DEPLOY_URL"
