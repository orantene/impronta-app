name: Vercel post-deploy alias

# Re-aliases EVERY custom domain onto the latest successful production
# deployment — the two ghost-locked platform domains AND the tenant storefront
# hosts. These domains can't be
# attached at the Vercel project level (a deleted predecessor project still
# "owns" them), so autoAssignCustomDomains skips them. See
# .claude/.../memory/project_vercel_deployment.md "Ghost project alias workaround".
#
# Fires on `deployment_status` — Vercel's GitHub App creates GitHub Deployments
# for every push, so this runs right after each prod deploy finishes.

on:
  deployment_status:

# ── Race fix (2026-07-11) ────────────────────────────────────────────────────
# When several PRs merge to `main` close together (common with multiple agents),
# each production deploy fires its own `deployment_status` event and its own run
# of this workflow. With no coordination those runs execute in PARALLEL and
# clobber each other: whichever run *finishes last* wins, which is NOT
# necessarily the newest deploy — so the domains drift onto a stale build and
# need a manual `vercel alias set`. This bit us repeatedly on 2026-07-11.
#
# Two defenses:
#  1. `concurrency` serializes runs (no parallel clobber). cancel-in-progress is
#     false so no run is dropped, each one re-asserts the alias in turn.
#  2. The step aliases to the QUERIED newest READY production deployment, not the
#     triggering event's target_url. This makes it order-independent and
#     self-healing: even a late/out-of-order run re-points the domains at the
#     true latest. target_url is only a fallback if the query returns empty.
concurrency:
  group: vercel-alias-production
  cancel-in-progress: false

jobs:
  alias:
    name: Re-alias ghost-locked domains
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Re-alias tulala.digital + app.tulala.digital
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          EVENT_URL: ${{ github.event.deployment_status.target_url }}
        run: |
          set -euo pipefail

          # Prefer the newest READY production deployment over the triggering
          # event's URL, so concurrent / out-of-order merges can't strand the
          # domains on a stale build. Fall back to the event URL if the query
          # yields nothing (e.g. a transient CLI hiccup).
          # RACE FIX 2 (2026-08-16): this query runs seconds after the deploy
          # reports ready, and `vercel ls` can still omit it — so "newest ready"
          # returned the PREVIOUS deployment and the domains were aliased to a
          # stale build. That is exactly what happened on 2026-08-16: the run
          # reported success while app.tulala.digital + tulala.digital sat on
          # the prior deploy and the ADMIN served a stale bundle for ~15 min,
          # long enough to make a just-shipped fix look like it had not landed.
          #
          # Wait until the listing catches up with the deployment the event
          # fired for, then take newest-ready (still order-independent, so a
          # late run for an older deploy re-points to the true latest).
          list_ready() {
            vercel ls tulala \
              --scope oran-tenes-projects \
              --token "$VERCEL_TOKEN" \
              --prod 2>/dev/null \
            | grep -i 'ready' \
            | grep -oE 'https://tulala-[a-z0-9]+-oran-tenes-projects\.vercel\.app' || true
          }
          for ATTEMPT in 1 2 3 4 5 6; do
            READY_LIST="$(list_ready)"
            # No event URL to wait for (manual/odd event) → first listing wins.
            if [[ -z "${EVENT_URL:-}" ]]; then break; fi
            if grep -qxF "$EVENT_URL" <<<"$READY_LIST"; then break; fi
            echo "::notice::listing has not caught up with $EVENT_URL (attempt $ATTEMPT/6) — retrying in 10s"
            sleep 10
          done
          LATEST="$(head -1 <<<"$READY_LIST")"
          # If the listing never caught up, trust the event: we KNOW that
          # deployment reported success, whereas newest-ready may be older than
          # it. Aliasing to an older build is the failure mode this whole step
          # exists to prevent.
          if [[ -n "${EVENT_URL:-}" ]] && ! grep -qxF "$EVENT_URL" <<<"$READY_LIST"; then
            echo "::warning::listing never showed $EVENT_URL — aliasing to the event deployment instead of $LATEST"
            LATEST="$EVENT_URL"
          fi

          DEPLOY_URL="${LATEST:-${EVENT_URL:-}}"
          if [[ -z "$DEPLOY_URL" ]]; then
            echo "::error::could not resolve a production deployment URL (no newest-ready, no event target_url)"
            exit 1
          fi

          if [[ -n "${LATEST:-}" && "$LATEST" != "${EVENT_URL:-}" ]]; then
            echo "::notice::event fired for ${EVENT_URL:-<none>} but newest-ready is $LATEST; aliasing to newest-ready"
          fi

          # Every custom host that must follow production.
          #
          # The tenant storefront hosts were MISSING here, which is why each
          # deploy needed a manual `vercel alias set` for them: the site looked
          # deployed while impronta.tulala.digital / improntamodels.com still
          # served the previous build. Source of truth for tenant hosts is the
          # `public.agency_domains` table — when a new agency domain is seeded
          # there, add it to this list (the runner has no DB access).
          DOMAINS=(
            tulala.digital
            app.tulala.digital
            impronta.tulala.digital
            improntamodels.com
          )

          echo "Aliasing $DEPLOY_URL -> ${DOMAINS[*]}"
          FAILED=()
          for D in "${DOMAINS[@]}"; do
            if vercel alias set "$DEPLOY_URL" "$D" \
                 --scope oran-tenes-projects \
                 --token "$VERCEL_TOKEN"; then
              echo "::notice::aliased $D"
            else
              # Don't abort the loop — one unreachable domain must not strand
              # the others on a stale build.
              echo "::warning::failed to alias $D"
              FAILED+=("$D")
            fi
          done

          if [[ "${#FAILED[@]}" -gt 0 ]]; then
            echo "::warning::alias command failed for: ${FAILED[*]} — the verify step below decides the run"
          fi

      - name: Verify every domain serves the new build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -uo pipefail
          # A green alias step has still left domains stale before (ghost-project
          # quirks), so assert reachability rather than trusting exit codes.
          BAD=0
          for D in tulala.digital app.tulala.digital impronta.tulala.digital improntamodels.com; do
            CODE="$(curl -sL -o /dev/null -w '%{http_code}' --max-time 25 "https://$D/" || echo 000)"
            if [[ "$CODE" == "200" || "$CODE" == "401" ]]; then
              echo "::notice::$D -> $CODE"
            else
              echo "::warning::$D returned $CODE"
              BAD=$((BAD+1))
            fi
          done
          if [[ "$BAD" -gt 0 ]]; then
            echo "::error::$BAD domain(s) did not serve a healthy response after aliasing"
            exit 1
          fi
