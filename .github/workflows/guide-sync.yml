name: Guide sync

# The Guide is generated from the product (docs/plans/support-guide-knowledge-plan-2026-09-17.md §3).
# When the registry that seeds it changes on main, or weekly, draft + verify
# the delta and publish it. Unchanged nodes cost zero calls (content hash).
#
# Secrets required (repo settings → Actions): GUIDE_ANTHROPIC_API_KEY,
# GUIDE_SUPABASE_URL, GUIDE_SUPABASE_SERVICE_ROLE_KEY, GUIDE_OPENAI_API_KEY
# (voice). The job is a no-op with a notice until they exist, so adding this
# file cannot redden main.

on:
  push:
    branches: [main]
    paths:
      - "web/src/components/admin/shell/internal/help-registry.ts"
      - "web/src/components/admin/shell/internal/help-registry-scheduling.ts"
      - "web/src/lib/guide/adhoc-nodes.ts"
      - "web/scripts/guide/**"
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC — the weekly digest + gap redrafts
  workflow_dispatch:
    inputs:
      force:
        description: "Regenerate every node (ignores the content hash). Costs credits; use --nodes normally."
        required: false
        # `type: boolean` constrains the value at the API boundary, so the only
        # values that can ever reach the job are true and false. Defence in
        # depth: the real fix is passing it through `env` rather than splicing
        # it into a run body (see "Draft + verify the delta").
        type: boolean
        default: false

concurrency:
  group: guide-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # The job reads the repo and writes to Supabase. It pushes nothing, opens no
    # PR and comments nowhere, so it needs no write scope. Without this block it
    # inherits the repository default, which may be read-write.
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    env:
      ANTHROPIC_API_KEY: ${{ secrets.GUIDE_ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.GUIDE_OPENAI_API_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.GUIDE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.GUIDE_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Check secrets
        id: secrets
        working-directory: .
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ] && [ -n "$NEXT_PUBLIC_SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "armed=true" >> "$GITHUB_OUTPUT"
          else
            echo "armed=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=guide-sync::GUIDE_* secrets not set — skipping. Add them to run the pipeline on merge."
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.armed == 'true'
        with:
          # Checkout otherwise writes GITHUB_TOKEN into .git/config, and the
          # `npm ci` below runs third-party postinstall scripts with both that
          # token and a Supabase service-role key in the environment.
          persist-credentials: false

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.armed == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies (npm ci)
        if: steps.secrets.outputs.armed == 'true'
        run: npm ci --no-audit --no-fund

      - name: Draft + verify the delta
        if: steps.secrets.outputs.armed == 'true'
        # FORCE arrives as an environment variable, never as a `${{ }}`
        # interpolation inside the run body. An interpolation is spliced into
        # the SCRIPT TEXT before bash sees it, so a dispatcher could close the
        # quote and append commands that run with ANTHROPIC_API_KEY,
        # OPENAI_API_KEY and SUPABASE_SERVICE_ROLE_KEY in scope. Same rule
        # db-push.yml states in its own header.
        env:
          FORCE: ${{ github.event.inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then
            node --import tsx scripts/guide/generate-guide-articles.mjs --all --force
          else
            node --import tsx scripts/guide/generate-guide-articles.mjs --all
          fi

      - name: Weekly gap redrafts (scheduled runs only)
        if: steps.secrets.outputs.armed == 'true' && github.event_name == 'schedule'
        run: node scripts/guide/guide-digest.mjs --redraft

      - name: Voice the delta
        if: steps.secrets.outputs.armed == 'true' && env.OPENAI_API_KEY != ''
        run: node scripts/guide/voice-guide-articles.mjs

      - name: Coverage gate
        if: steps.secrets.outputs.armed == 'true'
        run: node --import tsx scripts/guide/check-guide-coverage.mjs
