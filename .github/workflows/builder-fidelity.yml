name: Builder fidelity visual regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fidelity:
    name: Fidelity goldens
    runs-on: macos-14
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      PLAYWRIGHT_SKIP_WEBSERVER: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22.x
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run fidelity golden tests
        run: npx playwright test e2e/fidelity/fidelity.spec.ts --project=chromium

      - name: Upload fidelity diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fidelity-playwright-artifacts
          path: |
            web/test-results
            web/playwright-report
          if-no-files-found: ignore
