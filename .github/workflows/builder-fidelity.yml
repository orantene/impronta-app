name: Builder fidelity visual regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: "Regenerate (seed) the fidelity goldens on this runner and upload them as an artifact to commit. The goldens are macos-14-specific, so new/updated goldens must be seeded here, not on a dev mac."
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fidelity:
    name: Fidelity goldens
    runs-on: macos-14
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      PLAYWRIGHT_SKIP_WEBSERVER: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22.x
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run fidelity golden tests
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.update_snapshots) }}
        run: npx playwright test e2e/fidelity/fidelity.spec.ts --project=chromium

      # Manual seeding path. Goldens are macos-14-specific; new/updated frames
      # (e.g. the motion frames) can only be seeded to match CI on this runner.
      # Run this workflow with update_snapshots=true, then download the artifact
      # and commit its PNGs into e2e/fidelity/fidelity.spec.ts-snapshots/.
      - name: Seed fidelity goldens (--update-snapshots)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_snapshots }}
        run: npx playwright test e2e/fidelity/fidelity.spec.ts --project=chromium --update-snapshots

      - name: Upload seeded goldens
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_snapshots }}
        uses: actions/upload-artifact@v4
        with:
          name: fidelity-goldens-seeded
          path: web/e2e/fidelity/fidelity.spec.ts-snapshots
          if-no-files-found: warn

      - name: Upload fidelity diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fidelity-playwright-artifacts
          path: |
            web/test-results
            web/playwright-report
          if-no-files-found: ignore

  perf-budget:
    name: Builder perf budget
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22.x
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Enforce the published-page weight ceilings (HTML / renderer CSS / fonts /
      # images / DOM nodes / total transfer). Deterministic + offline — no browser
      # needed. Rationale + change-discipline: web/docs/builder-perf-budget.md.
      - name: Enforce perf budget
        run: npm run perf:builder-budget

      # Prove the gate still REJECTS bloat. A budget that can never fail is worse
      # than no budget — this fails CI if the enforcement is ever weakened.
      - name: Verify the gate rejects over-budget pages
        run: npm run perf:builder-budget:selftest

      - name: Upload perf budget report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: builder-perf-budget-report
          path: web/fidelity/perf-budget.json
          if-no-files-found: warn
