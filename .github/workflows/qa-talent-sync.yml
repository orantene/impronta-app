name: QA talent sync

# TUL-135. Reports drift of the QA twin (TAL-93900) from the real talent
# (TAL-93938, read-only); a manual run with apply=true syncs it. Then fails the run if either site is behind the
# latest published design release (GitHub notifies on failure).
#
# Secrets (repo settings): SUPABASE_ACCESS_TOKEN (already exists) and
# NEXT_PUBLIC_SUPABASE_URL. If the latter is not set, the URL is derived from
# the existing SUPABASE_PROJECT_REF secret.

on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC daily
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the sync to TAL-93900 (production write). Scheduled runs are always dry-run."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: qa-talent-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || format('https://{0}.supabase.co', secrets.SUPABASE_PROJECT_REF) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Scheduled runs are READ-ONLY: they print the drift. Writing to TAL-93900
      # needs a manual run with apply=true (Release Manager / PM).
      - name: Sync TAL-93900 from TAL-93938 (dry-run unless apply=true)
        run: node web/scripts/sync-qa-talent-from-real.mjs --auto ${{ (github.event_name == 'workflow_dispatch' && inputs.apply) && '--apply' || '' }}
      - name: Design drift monitor (fails if TAL-93900 / TAL-93938 is behind)
        if: always()
        run: node web/scripts/site-design-drift.mjs
