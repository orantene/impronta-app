name: QA talent sync

# TUL-135. Keeps the QA twin (TAL-93900) identical to the real talent
# (TAL-93938, read-only), then fails the run if either site is behind the
# latest published design release (GitHub notifies on failure).
#
# Secrets (repo settings): SUPABASE_ACCESS_TOKEN (already exists) and
# NEXT_PUBLIC_SUPABASE_URL. If the latter is not set, the URL is derived from
# the existing SUPABASE_PROJECT_REF secret.

on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-talent-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || format('https://{0}.supabase.co', secrets.SUPABASE_PROJECT_REF) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync TAL-93900 from TAL-93938 (prints the applied diff)
        run: node web/scripts/sync-qa-talent-from-real.mjs --apply --auto
      - name: Design drift monitor (fails if TAL-93900 / TAL-93938 is behind)
        if: always()
        run: node web/scripts/site-design-drift.mjs
