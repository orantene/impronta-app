# TEMPORARY — diagnose A6 #2276 Vercel preview FAILURE. Delete before merge.
name: Debug — Vercel inspect A6
on:
  workflow_dispatch:
    inputs:
      dpl:
        description: "Deployment id (dpl_…)"
        required: true
        default: "dpl_6RmVAgPf6fbCY1RXffS3xLCEQDrV"
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Inspect failed A6 deployments
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          DPLS=("${{ github.event.inputs.dpl }}" "dpl_9qsHZDoFyjbKoeM6vn6Pgs4pbpvR" "dpl_CSohscqxwTN8a1Bd3crRDF7aemBX")
          for DPL in "${DPLS[@]}"; do
            [ -n "$DPL" ] || continue
            echo "======== INSPECT $DPL ========"
            npx --yes vercel@latest inspect "$DPL" --token "$VERCEL_TOKEN" --scope oran-tenes-projects 2>&1 || true
            echo "======== LOGS $DPL ========"
            npx --yes vercel@latest inspect "$DPL" --logs --token "$VERCEL_TOKEN" --scope oran-tenes-projects 2>&1 | tail -400 || true
          done
