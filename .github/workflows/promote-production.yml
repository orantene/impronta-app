# CI-gated, MANUAL production release. THIS IS THE LIVE RELEASE PATH.
#
# Vercel's production branch is `production`. This workflow is the only thing
# that advances that pointer: it fast-forwards `production` to a `main` commit
# ONLY after the structural quality gate succeeded on that exact commit.
#
# RELEASE FLOW (TUL-827, 2026-10-14). Production no longer follows every green
# main. The flow is: PRs merge to `main` -> `main` deploys to staging -> staging
# is tested in large chunks -> promoted to production as ONE release, by hand
# (or batched). This workflow therefore has NO automatic trigger: the former
# `workflow_run` (every gate completion) and 10-minute `schedule` triggers were
# removed. It runs only on `workflow_dispatch`.
#
# P0 EXCEPTION. Only a P0 hotfix may be promoted outside the batch. Run it the
# same way with release_note="P0 hotfix: <reason>" and the hotfix commit's sha.
#
# HOW TO RUN:
#   gh workflow run promote-production.yml -f release_note="<what is in this release>" [-f sha=<sha>]
# `release_note` is required (one line; echoed into the job summary). `sha` is
# optional: blank = the newest green main commit ahead of production.
#
# Invariants (pinned by web/src/lib/quality/promote-production.static.test.ts):
#   - manual only: no workflow_run, no schedule, no pull_request trigger;
#   - fast-forward only: a plain `git push`, never --force / +refspec, and the
#     target must be a descendant of the current pointer (never backwards);
#   - the target is always a main commit whose `CI — structural quality gate`
#     run SUCCEEDED, never a commit that merely lacks a verdict. A manual run
#     does NOT bypass the gate; an explicit sha is re-checked and refused if red;
#   - own concurrency group, shared with no PR workflow (cancel-in-progress).
# Runner: set the repo variable PROMOTE_RUNNER to a dedicated runner label to
# take the job off the shared ubuntu-latest pool.

name: Promote production pointer

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit on main to promote (its gate run must be green). Leave blank for the newest green main commit."
        required: false
        type: string
      release_note:
        description: "One line: what is in this release, or `P0 hotfix: <reason>`."
        required: true
        type: string

permissions:
  contents: write
  actions: read

# Dedicated group. Cancel superseded runs: reconcile makes replacement safe
# (TUL-412). A stuck queued promote behind a flood of PR gates used to sit for
# 30-50 min; cancelling the stale one lets the newest run take the runner.
concurrency:
  group: promote-production
  cancel-in-progress: true

env:
  GATE_WORKFLOW: "CI — structural quality gate"

jobs:
  promote:
    name: Fast-forward `production` to the newest green commit
    runs-on: ${{ vars.PROMOTE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record release note
        env:
          RELEASE_NOTE: ${{ inputs.release_note }}
        run: |
          {
            echo "### Production release"
            echo
            echo "- Release note: ${RELEASE_NOTE}"
            echo "- Requested sha: ${{ inputs.sha || '(newest green main commit)' }}"
            echo "- Triggered by: ${{ github.actor }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve the newest commit whose gate run succeeded
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          if git fetch origin production 2>/dev/null; then HAVE_PROD=1; else HAVE_PROD=0; fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$INPUT_SHA" ]; then
            # Explicit sha: normalise to a FULL sha (the Actions API head_sha
            # filter matches only full shas), then require a green gate run on
            # exactly that commit. No fallback for an explicit request.
            SHA="$(git rev-parse "$INPUT_SHA^{commit}")"
            OK="$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$SHA&status=success&per_page=100" \
              --jq "[.workflow_runs[] | select(.name == \"$GATE_WORKFLOW\")] | length")"
            if [ "$OK" = "0" ]; then
              echo "::error::Refusing to promote $SHA — the structural quality gate has not succeeded on it."
              exit 1
            fi
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
            echo "::notice::CI vetted $SHA — proceeding."
            exit 0
          fi

          # Fallback scan. A gh api failure aborts the job (set -e): an unknown
          # verdict must never be read as green.
          GREEN="$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=100" \
            --jq ".workflow_runs[] | select(.name == \"$GATE_WORKFLOW\") | select(.event != \"pull_request\") | .head_sha" | sort -u)"

          if [ "$HAVE_PROD" = "1" ]; then RANGE="origin/main ^origin/production"; else RANGE="origin/main"; fi
          TARGET=""
          for C in $(git rev-list --first-parent --max-count=200 $RANGE); do
            if printf '%s\n' "$GREEN" | grep -qx "$C"; then
              # Never move backwards or sideways: the pointer must be an ancestor.
              if [ "$HAVE_PROD" = "1" ] && ! git merge-base --is-ancestor origin/production "$C"; then continue; fi
              TARGET="$C"
              break
            fi
          done

          if [ -z "$TARGET" ]; then
            echo "::notice::No green main commit ahead of production — nothing to promote."
          else
            echo "::notice::Newest green main commit ahead of production: $TARGET"
          fi
          echo "sha=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Fast-forward production
        if: ${{ steps.resolve.outputs.sha != '' }}
        run: |
          set -euo pipefail
          SHA="${{ steps.resolve.outputs.sha }}"
          for ATTEMPT in 1 2 3; do
            git fetch origin main
            # Only promote commits that are actually on main.
            if ! git merge-base --is-ancestor "$SHA" origin/main; then
              echo "::notice::$SHA is not on main — skipping."
              exit 0
            fi
            if git fetch origin production 2>/dev/null; then
              if git merge-base --is-ancestor "$SHA" origin/production; then
                echo "::notice::production already at or past $SHA — nothing to do."
                exit 0
              fi
              if ! git merge-base --is-ancestor origin/production "$SHA"; then
                echo "::error::$SHA is not a fast-forward of production — refusing to move the pointer."
                exit 1
              fi
            fi
            # Plain push, no force: git rejects anything but a fast-forward.
            if git push origin "$SHA:refs/heads/production"; then
              echo "::notice title=production advanced::production → $SHA (green gate)"
              exit 0
            fi
            echo "::warning::push rejected (attempt $ATTEMPT) — production moved concurrently; re-evaluating."
            sleep 5
          done
          echo "::error::could not fast-forward production after 3 attempts."
          exit 1
