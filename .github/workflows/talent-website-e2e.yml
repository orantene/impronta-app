# ─────────────────────────────────────────────────────────────────────────────
# Talent website E2E — self-contained, NO repository secrets required.
#
# Boots a throwaway local Supabase inside the runner (official supabase CLI,
# Docker), builds the database schema, and (in later Phase Q steps) runs the
# talent-website Playwright journey against it. The database is local to the
# job: this lane never touches production or any shared Supabase project.
#
# How the schema is built (see supabase/ci/README.md):
#   - ARMED   (supabase/e2e-baseline.sql exists): load the baseline, then apply
#             every migration newer than it, strictly in order.
#   - UNARMED (no baseline yet): replay the whole migration history from an
#             empty database with supabase/ci/apply-migrations.sh --defer.
#             As of 2026-09-23 this replay SUCCEEDS end to end — no baseline,
#             no production credentials, no founder step. The files that
#             cannot apply as written are handled by documented shims in
#             supabase/ci/migration-shims/; supabase/ci/README.md lists the
#             five shapes and the rule for writing one. Anything that still
#             cannot apply fails the job, with its full error text in the
#             job summary.
#
# CI-only overrides (applied to the runner's checkout, never committed):
#   - [db.seed] off: config.toml seeds seed_demo_profiles.sql (demo roster).
#   - [db.migrations] off: `supabase start` would stop at the first migration
#     that cannot replay; the runner script applies them instead.
#   - services the smoke does not need are excluded with -x to save time.
# ─────────────────────────────────────────────────────────────────────────────

name: Talent website E2E

on:
  pull_request:
    paths:
      - "web/src/lib/talent-site/**"
      - "web/src/lib/talent-site/theme-catalog/**"
      - "web/src/lib/site-admin/builder-core/**"
      - "web/src/lib/saas/host-context.ts"
      - "web/src/proxy.ts"
      - "web/src/components/talent/**"
      - "web/src/components/admin/shell/**"
      - "web/e2e/talent-website/**"
      - "supabase/migrations/**"
      - "supabase/ci/**"
      - ".github/workflows/talent-website-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: talent-website-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  migrations:
    name: Local Supabase + migration chain
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PGHOST: 127.0.0.1
      PGPORT: "54322"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # PINNED, not `latest`. `latest` makes the action resolve a release
          # over the GitHub API on every run, and that call is rate limited:
          # this lane went red with "Failed to resolve latest Supabase CLI
          # release: rate limit exceeded" after 31 seconds, before it reached a
          # single migration. A version the lane does not choose is also a
          # version the lane cannot reproduce — a CLI release could change the
          # replay result with no commit here to explain it.
          version: 2.117.0

      - name: CI-only config overrides (seed off, CLI migrations off)
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("supabase/config.toml")
          s = p.read_text()
          for section in ("db.seed", "db.migrations"):
              pat = r"(\[" + re.escape(section) + r"\]\s*(?:#[^\n]*\n|\s)*enabled\s*=\s*)true"
              s, n = re.subn(pat, r"\1false", s)
              assert n == 1, f"could not find [{section}] enabled = true"
          p.write_text(s)
          PY
          grep -n -A3 -E '^\[db\.(seed|migrations)\]' supabase/config.toml
          echo "Migrations on disk: $(ls supabase/migrations | grep -cE '^[0-9]+_.*\.sql$')"

      # `supabase start` pulls its images from ghcr.io (SUPABASE_INTERNAL_IMAGE_
      # REGISTRY), and this lane died THREE times in one evening on:
      #
      #   Error response from daemon: toomanyrequests: retry-after: 225µs,
      #   allowed: 44000/minute
      #
      # That 44000/minute is a SHARED burst bucket keyed on the runner's egress
      # IP, not on our account. MEASURED: `docker login ghcr.io` with the job's
      # own GITHUB_TOKEN does NOT lift it — tried on this branch, the login
      # succeeded and the pull still failed 50 times. So authenticating is not
      # the fix and the login step was removed rather than left in place looking
      # like one.
      #
      # What is left is honest backoff. The bucket refills per MINUTE, so a 30s
      # retry is too fast to help; this waits 75s and tries five times, which
      # spans six minutes of refills. A run that dies here measures the RUNNER,
      # not our fixtures, so it is worth spending minutes to avoid producing a
      # misleading number.
      - name: Start local Supabase
        run: |
          set -o pipefail
          supabase --version
          # Retry the pull-heavy start: even authenticated, a transient registry
          # failure should cost 30 seconds, not the whole run.
          for attempt in 1 2 3 4 5; do
            if supabase start \
                 -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta,realtime; then
              echo "supabase start succeeded on attempt $attempt"
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "::warning title=supabase start failed::attempt $attempt of 5, waiting 75s for the registry bucket to refill"
              supabase stop --no-backup || true
              sleep 75
            fi
          done
          echo "::error title=supabase start::failed 5 times over ~6 minutes. If the log shows toomanyrequests this is the shared ghcr bucket, NOT our code — the run proves nothing about the fixtures."
          exit 1

      - name: psql client
        run: |
          command -v psql || { sudo apt-get update -q && sudo apt-get install -y -q postgresql-client; }
          psql --version
          psql -Atc "select current_user, version()"

      - name: Build schema (baseline + delta, or full replay)
        id: schema
        run: |
          set -o pipefail
          if [ -f supabase/e2e-baseline.sql ]; then
            echo "mode=baseline" >> "$GITHUB_OUTPUT"
            psql -X -q -v ON_ERROR_STOP=1 -f supabase/e2e-baseline.sql
            after=$(psql -Atc "select coalesce(max(version), '0') from supabase_migrations.schema_migrations")
            echo "Baseline loaded; applying migrations after $after"
            bash supabase/ci/apply-migrations.sh --after "$after" | tee "$RUNNER_TEMP/apply.log"
          else
            echo "mode=replay" >> "$GITHUB_OUTPUT"
            echo "Replaying the full migration history from empty (no baseline needed; see supabase/ci/README.md)."
            MIGRATION_LOG="$RUNNER_TEMP/order.log" \
            FAILURE_REPORT="$RUNNER_TEMP/failures.txt" \
              bash supabase/ci/apply-migrations.sh --defer | tee "$RUNNER_TEMP/apply.log"
          fi

      - name: Report
        if: always() && steps.schema.outcome != 'skipped'
        run: |
          on_disk=$(ls supabase/migrations | grep -cE '^[0-9]+_.*\.sql$')
          applied=$(psql -Atc "select count(*) from supabase_migrations.schema_migrations" 2>/dev/null || echo 0)
          tables=$(psql -Atc "select count(*) from information_schema.tables where table_schema='public' and table_type='BASE TABLE'" 2>/dev/null || echo 0)
          echo "Mode:               ${{ steps.schema.outputs.mode }}"
          echo "Migrations on disk: $on_disk"
          echo "Migrations applied: $applied"
          echo "Public tables:      $tables"
          {
            echo "### Talent website E2E — schema"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Mode | ${{ steps.schema.outputs.mode }} |"
            echo "| Migrations on disk | $on_disk |"
            echo "| Migrations applied | $applied |"
            echo "| Public tables | $tables |"
            echo ""
            if [ -s "$RUNNER_TEMP/failures.txt" ]; then
              echo "#### Migrations that could not apply"
              echo '```'
              sed 's/^psql:[^ ]* //' "$RUNNER_TEMP/failures.txt" | head -200
              echo '```'
            elif grep -q '::error' "$RUNNER_TEMP/apply.log" 2>/dev/null; then
              echo "#### Migrations that could not apply"
              echo '```'
              grep -A3 '::error' "$RUNNER_TEMP/apply.log" | grep -E '::error|ERROR' | sed 's/^psql:[^ ]* //' | head -120
              echo '```'
            fi
            if grep -q '::warning title=Migration replaced' "$RUNNER_TEMP/apply.log" 2>/dev/null; then
              echo "#### Applied from a replacement, not the migration file"
              echo '```'
              grep '::warning title=Migration replaced' "$RUNNER_TEMP/apply.log" | sed 's/.*replaced:://'
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # ─────────────────────────────────────────────────────────────────
      # JOURNEYS. Same job, because the local Supabase above lives in this
      # runner and jobs do not share services.
      #
      # These do NOT gate a merge: this workflow is not one of the four
      # required checks. That is deliberate — the journeys have never run
      # before, so their first honest signal is information, not a gate.
      # ─────────────────────────────────────────────────────────────────
      - name: Setup Node 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies (npm ci)
        working-directory: web
        run: npm ci

      - name: Read local Supabase keys
        id: sbkeys
        run: |
          set -o pipefail
          supabase status -o env > "$RUNNER_TEMP/sb.env"
          # shellcheck disable=SC1090
          . "$RUNNER_TEMP/sb.env"
          # Mask before anything can echo them. These are the LOCAL stack's
          # keys, not production's, but a masked log costs nothing and stops a
          # copy-paste from training anyone that printing a service role key is
          # normal.
          echo "::add-mask::$SERVICE_ROLE_KEY"
          echo "::add-mask::$ANON_KEY"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "ANON_KEY=$ANON_KEY"
            echo "SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      # GoTrue answers "Database error finding users" (500) without logging a
      # cause, and the db container logs only the replay's own statements. So
      # ask the database directly, as the role GoTrue uses, BEFORE the seed.
      # Non-fatal: this step exists to explain a failure, not to cause one.
      # GoTrue boots BEFORE the replay runs, and the replay then creates a
      # trigger on auth.users (20250409000000_init.sql `on_auth_user_created`).
      # Restart it so it is not holding connections or a schema view from before
      # 861 migrations landed. Cheap, and it removes a whole class of "works
      # after a restart" ambiguity from the diagnosis below.
      # The post-shim for 20260911022138 normalises that migration's proof rows,
      # but it did not clear the failure: something else in the replay also
      # leaves NULLs in auth.users' token columns. Rather than hunt each source
      # across 861 files, normalise ONCE after the whole chain, and REPORT the
      # row count so the shim's necessity (or redundancy) is visible rather than
      # assumed.
      #
      # GoTrue scans these into Go `string`, so a single NULL anywhere breaks
      # /admin/users for every user — which is the seed's first call.
      # Production and QA both hold zero NULLs, so this reproduces their real
      # state; it does not paper over a product defect.
      - name: Normalise auth.users token columns
        run: |
          set -o pipefail
          before=$(psql -Atc "select count(*) from auth.users where confirmation_token is null or recovery_token is null or email_change_token_new is null or email_change is null or email_change_token_current is null or phone_change is null or phone_change_token is null or reauthentication_token is null")
          psql -q -c "update auth.users set
              confirmation_token=coalesce(confirmation_token,''),
              recovery_token=coalesce(recovery_token,''),
              email_change_token_new=coalesce(email_change_token_new,''),
              email_change=coalesce(email_change,''),
              email_change_token_current=coalesce(email_change_token_current,''),
              phone_change=coalesce(phone_change,''),
              phone_change_token=coalesce(phone_change_token,''),
              reauthentication_token=coalesce(reauthentication_token,'')"
          after=$(psql -Atc "select count(*) from auth.users where confirmation_token is null or recovery_token is null")
          total=$(psql -Atc "select count(*) from auth.users")
          echo "auth.users rows: $total | with NULL tokens before: $before | after: $after"
          {
            echo "| auth.users rows | NULL-token rows before | after |"
            echo "|---|---|---|"
            echo "| $total | $before | $after |"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$after" = "0" ] || { echo "::error::auth.users still has NULL token columns"; exit 1; }

      - name: Restart GoTrue after the schema is built
        run: |
          docker restart supabase_auth_impronta-app
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$SUPABASE_URL/auth/v1/health" || true)
            [ "$code" = "200" ] && { echo "auth healthy after ${i}s"; break; }
            sleep 1
          done
          curl -s "$SUPABASE_URL/auth/v1/health" || true
          echo

      - name: Probe auth schema health
        if: always()
        continue-on-error: true
        run: |
          exec > >(tee -a "$GITHUB_STEP_SUMMARY") 2>&1
          echo '```'
          echo "role exists:        $(psql -Atc "select count(*) from pg_roles where rolname='supabase_auth_admin'")"
          echo "auth.users RLS on:  $(psql -Atc "select relrowsecurity from pg_class where oid='auth.users'::regclass")"
          echo "select priv:        $(psql -Atc "select has_table_privilege('supabase_auth_admin','auth.users','select')")"
          echo "auth schema usage:  $(psql -Atc "select has_schema_privilege('supabase_auth_admin','auth','usage')")"
          echo "public schema usage:$(psql -Atc "select has_schema_privilege('supabase_auth_admin','public','usage')")"
          echo "auth.users columns: $(psql -Atc "select count(*) from information_schema.columns where table_schema='auth' and table_name='users'")"
          echo "triggers on auth.users:"
          psql -Atc "select tgname, tgrelid::regclass::text from pg_trigger where tgrelid='auth.users'::regclass and not tgisinternal" || true
          echo "auth.identities cols: $(psql -Atc "select count(*) from information_schema.columns where table_schema='auth' and table_name='identities'")"
          echo "auth tables:        $(psql -Atc "select string_agg(table_name,',' order by table_name) from information_schema.tables where table_schema='auth'")"
          echo "--- ASK GOTRUE ITSELF (its own error body, not an inference) ---"
          code=$(curl -s -o "$RUNNER_TEMP/gotrue.json" -w '%{http_code}' \
            -H "Authorization: Bearer $SERVICE_ROLE_KEY" \
            -H "apikey: $SERVICE_ROLE_KEY" \
            "$SUPABASE_URL/auth/v1/admin/users?page=1&per_page=1" || echo "curl-failed")
          echo "HTTP $code"
          # The body can echo the key back on some errors; scrub before printing.
          sed -e "s/${SERVICE_ROLE_KEY}/***/g" "$RUNNER_TEMP/gotrue.json" | head -20
          echo "--- auth container log, last 40 ---"
          docker logs supabase_auth_impronta-app 2>&1 | tail -40 || true
          echo '```'

      # The journeys navigate to the fixtures' CUSTOM DOMAINS, which are
      # `.test` names with no DNS anywhere by design. Without these entries the
      # run dies at
      #   page.goto: net::ERR_NAME_NOT_RESOLVED at http://free-site.test:3000/
      # which reads as a broken test rather than a missing hosts file.
      #
      # `.test` is reserved by RFC 6761 precisely so it can never resolve
      # publicly, so mapping it locally is the intended way to use it — not a
      # workaround. The `lvh.me` names DO resolve to 127.0.0.1 publicly, but are
      # pinned here too so the lane does not depend on a third party's DNS.
      - name: Map the fixture custom domains to loopback
        run: |
          set -o pipefail
          sudo tee -a /etc/hosts >/dev/null <<'HOSTS'
          127.0.0.1 free-site.test
          127.0.0.1 max-site.test
          127.0.0.1 impronta.lvh.me
          127.0.0.1 acme.lvh.me
          HOSTS
          for h in free-site.test max-site.test impronta.lvh.me acme.lvh.me; do
            getent hosts "$h" || { echo "::error::$h did not resolve after the hosts edit"; exit 1; }
          done

      - name: Seed talent-website fixtures
        working-directory: web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}
        run: |
          set -o pipefail
          npx tsx e2e/talent-website/seed.ts

      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      # Playwright auto-starts `npm run dev` because the base URL is loopback,
      # waits for it, runs `talent-website-setup` (one dev-signin per fixture),
      # then the journeys. `localhost` resolves as a host because
      # 20260922100000_agency_domains_localhost_app_dev.sql registers it and
      # host-context.ts has the matching branch — otherwise every request would
      # 404 "Host not registered" before routing.
      - name: Run talent-website journeys
        id: journeys
        working-directory: web
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          PORT: "3000"
          # THE JOURNEYS REQUIRE THE FEATURE SWITCHES ON. The lane set none of
          # them, so the dev server ran with every talent-website feature dark:
          # `/t/site/<slug>` answered 404 (observed for both free-site-fiona and
          # max-site-maxine), the gallery did not exist, and the plan surfaces
          # had nothing to assert against. j2's own header states the
          # expectation: "Server: started with TALENT_FREE_WEBSITE_ENABLED=true
          # (the harness default)".
          #
          # j0 is the deliberate exception: it asserts flags-OFF parity and
          # skips unless E2E_TALENT_FLAGS=off, so it stays skipped here and
          # needs its own run to be meaningful.
          TALENT_THEME_GALLERY_ENABLED: "true"
          TALENT_FREE_WEBSITE_ENABLED: "true"
          TALENT_SITE_SUBDOMAINS_ENABLED: "true"
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}
          NODE_ENV: development
        run: |
          set -o pipefail
          npx playwright test --project=talent-website

      - name: Journey result in the summary
        if: always() && steps.journeys.conclusion != 'skipped'
        run: |
          {
            echo "### Talent website E2E — journeys"
            echo ""
            echo "Outcome: **${{ steps.journeys.outcome }}**"
            echo ""
            echo "Journeys do not gate a merge; this lane is not a required check."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report + traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: talent-website-playwright-report
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore

      # On failure, show the ERRORS rather than the tail. The tail is dominated
      # by the replay's own statement log, so it scrolls the actual fault off
      # the end — a seed failing with GoTrue's opaque "Database error finding
      # users" produced 80 lines of unrelated migration SQL and no cause.
      - name: Supabase container logs on failure
        if: failure()
        run: |
          for c in $(docker ps --format '{{.Names}}' | grep -E 'supabase_(db|auth|rest)_' || true); do
            echo "::group::$c — errors"
            docker logs "$c" 2>&1 \
              | grep -iE 'ERROR|FATAL|PANIC|permission denied|does not exist|level=(error|fatal)' \
              | tail -40 || echo "(no error lines)"
            echo "::endgroup::"
            echo "::group::$c — last 30 lines"
            docker logs "$c" 2>&1 | tail -30 || true
            echo "::endgroup::"
          done
