# ─────────────────────────────────────────────────────────────────────────────
# Talent website E2E — self-contained, NO repository secrets required.
#
# Boots a throwaway local Supabase inside the runner (official supabase CLI,
# Docker), builds the database schema from the migration history, seeds the
# talent-website fixtures and runs the smoke journey against the real app. The
# database is local to the job: this lane never touches production or any
# shared Supabase project.
#
# How the schema is built (see supabase/ci/README.md):
#   ONE WAY, always: replay the whole migration history from an empty database
#   with supabase/ci/apply-migrations.sh --defer. As of 2026-09-23 that replay
#   SUCCEEDS end to end — 859/859, no baseline, no production credentials, no
#   founder step. The files that cannot apply as written are handled by
#   documented shims in supabase/ci/migration-shims/; supabase/ci/README.md
#   lists the six shapes and the rule for writing one. Anything that still
#   cannot apply fails the job, with its full error text in the job summary.
#
#   There is NO baseline branch any more. supabase/e2e-baseline.sql was a
#   production `db dump` this lane would have had to be handed by a human; the
#   replay removed the need for it, so depending on it — even optionally — kept
#   alive the idea that someone must eventually produce one. Nobody does.
#
# Running it locally, with no Docker at all (same scripts, same seed, same
# journey): supabase/ci/RUNBOOK.md.
#
# CI-only overrides (applied to the runner's checkout, never committed):
#   - [db.seed] off: config.toml seeds seed_demo_profiles.sql (demo roster).
#   - [db.migrations] off: `supabase start` would stop at the first migration
#     that cannot replay; the runner script applies them instead.
#   - services the smoke does not need are excluded with -x to save time.
# ─────────────────────────────────────────────────────────────────────────────

name: Talent website E2E

on:
  pull_request:
    paths:
      - "web/src/lib/talent-site/**"
      - "web/src/lib/talent-site/theme-catalog/**"
      - "web/src/lib/site-admin/builder-core/**"
      - "web/src/lib/saas/host-context.ts"
      - "web/src/proxy.ts"
      - "web/src/components/talent/**"
      - "web/src/components/admin/shell/**"
      - "web/e2e/talent-website/**"
      - "supabase/migrations/**"
      - "supabase/ci/**"
      - ".github/workflows/talent-website-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: talent-website-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  migrations:
    name: Local Supabase + migration chain
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PGHOST: 127.0.0.1
      PGPORT: "54322"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: CI-only config overrides (seed off, CLI migrations off)
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("supabase/config.toml")
          s = p.read_text()
          for section in ("db.seed", "db.migrations"):
              pat = r"(\[" + re.escape(section) + r"\]\s*(?:#[^\n]*\n|\s)*enabled\s*=\s*)true"
              s, n = re.subn(pat, r"\1false", s)
              assert n == 1, f"could not find [{section}] enabled = true"
          p.write_text(s)
          PY
          grep -n -A3 -E '^\[db\.(seed|migrations)\]' supabase/config.toml
          echo "Migrations on disk: $(ls supabase/migrations | grep -cE '^[0-9]+_.*\.sql$')"

      - name: Start local Supabase
        run: |
          supabase --version
          supabase start \
            -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta,realtime

      - name: psql client
        run: |
          command -v psql || { sudo apt-get update -q && sudo apt-get install -y -q postgresql-client; }
          psql --version
          psql -Atc "select current_user, version()"

      - name: Build schema (full replay from empty)
        id: schema
        run: |
          set -o pipefail
          echo "Replaying the full migration history from empty (see supabase/ci/README.md)."
          MIGRATION_LOG="$RUNNER_TEMP/order.log" \
          FAILURE_REPORT="$RUNNER_TEMP/failures.txt" \
            bash supabase/ci/apply-migrations.sh --defer | tee "$RUNNER_TEMP/apply.log"

      - name: Report
        if: always() && steps.schema.outcome != 'skipped'
        run: |
          on_disk=$(ls supabase/migrations | grep -cE '^[0-9]+_.*\.sql$')
          applied=$(psql -Atc "select count(*) from supabase_migrations.schema_migrations" 2>/dev/null || echo 0)
          tables=$(psql -Atc "select count(*) from information_schema.tables where table_schema='public' and table_type='BASE TABLE'" 2>/dev/null || echo 0)
          echo "Migrations on disk: $on_disk"
          echo "Migrations applied: $applied"
          echo "Public tables:      $tables"
          {
            echo "### Talent website E2E — schema"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Migrations on disk | $on_disk |"
            echo "| Migrations applied | $applied |"
            echo "| Public tables | $tables |"
            echo ""
            if [ -s "$RUNNER_TEMP/failures.txt" ]; then
              echo "#### Migrations that could not apply"
              echo '```'
              sed 's/^psql:[^ ]* //' "$RUNNER_TEMP/failures.txt" | head -200
              echo '```'
            elif grep -q '::error' "$RUNNER_TEMP/apply.log" 2>/dev/null; then
              echo "#### Migrations that could not apply"
              echo '```'
              grep -A3 '::error' "$RUNNER_TEMP/apply.log" | grep -E '::error|ERROR' | sed 's/^psql:[^ ]* //' | head -120
              echo '```'
            fi
            if grep -q '::warning title=Migration replaced' "$RUNNER_TEMP/apply.log" 2>/dev/null; then
              echo "#### Applied from a replacement, not the migration file"
              echo '```'
              grep '::warning title=Migration replaced' "$RUNNER_TEMP/apply.log" | sed 's/.*replaced:://'
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # A green replay proves the 859 files APPLY. It does not prove the result
      # is production's schema — a shim that quietly papered over a real
      # difference would be just as green. This diffs the built database
      # against web/src/lib/supabase/database.types.ts, which is generated FROM
      # production and is the only production-derived artefact in this repo.
      # Missing or mismatched objects fail the job; extra ones are only listed.
      - name: Verify schema fidelity against database.types.ts
        if: always() && steps.schema.outcome == 'success'
        run: |
          set -o pipefail
          # Only the two modules the script needs, not all of web/.
          mkdir -p "$RUNNER_TEMP/verifydeps"
          npm install --no-save --no-audit --no-fund \
            --prefix "$RUNNER_TEMP/verifydeps" typescript pg >/dev/null
          VERIFY_SCHEMA_DEPS="$RUNNER_TEMP/verifydeps" \
            node supabase/ci/verify-schema.ts 2>&1 | tee "$RUNNER_TEMP/verify.log"

      - name: Schema fidelity summary
        if: always() && hashFiles(format('{0}/verify.log', runner.temp)) != ''
        run: |
          {
            echo "### Schema fidelity vs database.types.ts"
            echo ""
            echo '```'
            head -150 "$RUNNER_TEMP/verify.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ── The journey ─────────────────────────────────────────────────────────
      # Everything below runs the SAME committed files the no-Docker local loop
      # runs (supabase/ci/RUNBOOK.md): the same seed script, the same env
      # builder, the same spec. Only the Supabase underneath differs — a real
      # `supabase start` here, the PostgREST + auth stand-in locally.
      - name: Setup Node
        if: steps.schema.outcome == 'success'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        if: steps.schema.outcome == 'success'
        working-directory: web
        run: npm ci

      - name: Seed talent-website fixtures
        if: steps.schema.outcome == 'success'
        run: |
          set -euo pipefail
          # The CLI's OWN local keys, printed by the stack it just started.
          # Never a repository secret: this lane has none and needs none.
          eval "$(supabase status -o env | sed 's/^/export /')"
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY"
          cd web && npx tsx e2e/talent-website/seed.ts

      - name: Build the app against the seeded database
        if: steps.schema.outcome == 'success'
        run: |
          set -euo pipefail
          eval "$(supabase status -o env | sed 's/^/export /')"
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY"
          APP_PORT=3400 bash supabase/ci/app-env.sh
          cd web && npm run build

      # The proxy gates on the Host header and a browser will not let a test
      # forge it, so the fixture's custom domain has to resolve to the runner.
      - name: Resolve the fixture custom domains to localhost
        if: steps.schema.outcome == 'success'
        run: echo "127.0.0.1 max-site.test free-site.test acme.lvh.me" | sudo tee -a /etc/hosts

      - name: Smoke journey (Playwright)
        id: journey
        if: steps.schema.outcome == 'success'
        working-directory: web
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3400
          PLAYWRIGHT_SKIP_WEBSERVER: "1"
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          PORT=3400 npx next start -p 3400 &
          for i in $(seq 1 60); do
            curl -fsS "http://localhost:3400/t/TAL-QA-MAX" >/dev/null 2>&1 && break
            sleep 2
          done
          npx playwright test e2e/talent-website/smoke.spec.ts --project=chromium --reporter=line

      - name: Journey evidence
        if: always() && steps.journey.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: talent-website-smoke-evidence
          path: |
            qa-evidence/talent-website/local/
            web/test-results/
          if-no-files-found: ignore

      - name: Supabase DB logs on failure
        if: failure()
        run: docker logs supabase_db_impronta-app 2>&1 | tail -80 || true
