# ─────────────────────────────────────────────────────────────────────────────
# Talent website E2E — self-contained, NO repository secrets required.
#
# Boots a throwaway local Supabase inside the runner (official supabase CLI,
# Docker), applies EVERY migration in supabase/migrations/ from scratch, and
# (in later Phase Q steps) runs the talent-website Playwright journey against
# it. Because the database is local to the job, this lane never touches the
# production or any shared Supabase project and needs no E2E_* secrets.
#
# Step Q.1/Q.2 scope: prove the full migration chain applies from an empty
# database, and print how many migrations were applied and how many public
# tables exist. See web/docs/talent-website-execution-plan-2026-09-23.md
# ("Phase Q").
#
# CI-only overrides (applied to the runner's checkout, never committed):
#   - seed disabled: config.toml seeds seed_demo_profiles.sql, which is demo
#     roster data the migration-chain check does not need.
#   - services not needed by the app smoke are excluded with -x to save time.
# ─────────────────────────────────────────────────────────────────────────────

name: Talent website E2E

on:
  pull_request:
    paths:
      - "web/src/lib/talent-site/**"
      - "web/src/lib/talent-site/theme-catalog/**"
      - "web/src/lib/site-admin/builder-core/**"
      - "web/src/lib/saas/host-context.ts"
      - "web/src/proxy.ts"
      - "web/src/components/talent/**"
      - "web/src/components/admin/shell/**"
      - "web/e2e/talent-website/**"
      - "supabase/migrations/**"
      - ".github/workflows/talent-website-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: talent-website-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  migrations:
    name: Local Supabase + full migration chain
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: CI-only config overrides (seed off)
        run: |
          # Turn off [db.seed] for this job only. The committed config keeps
          # seeding for developers' local stacks.
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("supabase/config.toml")
          s = p.read_text()
          s, n = re.subn(r"(\[db\.seed\]\s*(?:#[^\n]*\n|\s)*enabled\s*=\s*)true", r"\1false", s)
          assert n == 1, "could not find [db.seed] enabled = true"
          p.write_text(s)
          PY
          grep -n -A3 '^\[db.seed\]' supabase/config.toml
          echo "Migrations on disk: $(ls supabase/migrations | grep -cE '^[0-9]+_.*\.sql$')"

      - name: Start local Supabase (applies all migrations)
        run: |
          supabase --version
          supabase start \
            -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta,realtime

      - name: Verify every migration applied
        run: |
          DB=supabase_db_impronta-app
          on_disk=$(ls supabase/migrations | grep -cE '^[0-9]+_.*\.sql$')
          applied=$(docker exec "$DB" psql -U postgres -d postgres -tAc \
            "select count(*) from supabase_migrations.schema_migrations")
          tables=$(docker exec "$DB" psql -U postgres -d postgres -tAc \
            "select count(*) from information_schema.tables where table_schema='public' and table_type='BASE TABLE'")
          echo "Migrations on disk: $on_disk"
          echo "Migrations applied: $applied"
          echo "Public tables:      $tables"
          {
            echo "### Talent website E2E — migration chain"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Migrations on disk | $on_disk |"
            echo "| Migrations applied | $applied |"
            echo "| Public tables | $tables |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$on_disk" != "$applied" ]; then
            echo "::error title=Migration chain incomplete::$applied of $on_disk migrations applied"
            exit 1
          fi

      - name: Supabase logs on failure
        if: failure()
        run: |
          docker ps -a || true
          docker logs supabase_db_impronta-app 2>&1 | tail -200 || true
