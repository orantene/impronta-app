# Runtime boot smoke (TUL-1769). Builds the app, starts the COMPILED server the way Vercel runs it
# (Node 22, NODE_OPTIONS=--no-experimental-require-module, so require(esm) throws ERR_REQUIRE_ESM
# at runtime) and fails unless / and an admin page answer 200 and the server log is free of
# ERR_REQUIRE_ESM. Exists because on 2026-10-21 every page 500'd on Vercel (isomorphic-dompurify /
# jsdom ESM) while every other check was green. Logic lives in web/scripts/ci/runtime-boot-smoke.mjs.
#
# REQUIRED CHECK NAME: "Runtime boot smoke (Vercel-style Node 22)"
# Node: package.json `engines.node` is "22.x" (no minor is pinned anywhere in the repo), so we use
# setup-node 22.x, which tracks the latest 22 like Vercel does.

name: CI — runtime boot smoke

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read   # gate policy reads PR labels

concurrency:
  group: runtime-boot-smoke-${{ github.event.pull_request.number || (github.ref == 'refs/heads/main' && github.sha || github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  runtime-boot-smoke:
    name: Runtime boot smoke (Vercel-style Node 22)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    env:
      RUNTIME_SMOKE_LOG: ${{ runner.temp }}/runtime-boot-smoke.log
    steps:
      # Same policy as the structural gate (ci.yml): ordinary PRs ship inside an integ/* batch whose
      # run covers them, so here they fail in seconds instead of burning a runner. Add `full-ci` to
      # run it on a single PR. Failing (not skipping) keeps the required check red.
      - name: Gate policy (ordinary PRs ship via an integ batch)
        id: policy
        working-directory: .
        env:
          IS_PR: ${{ github.event_name == 'pull_request' }}
          IS_INTEG: ${{ startsWith(github.head_ref, 'integ/') }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          HAS_LABEL=false
          if [ "$IS_PR" = "true" ] && [ "$IS_INTEG" != "true" ]; then
            gh pr view "$PR_NUMBER" --json labels -q ".labels[].name" | grep -qx "full-ci" && HAS_LABEL=true
          fi
          if [ "$IS_PR" != "true" ] || [ "$IS_INTEG" = "true" ] || [ "$HAS_LABEL" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::error::Ordinary PRs ship inside an integ/* batch, whose run covers them. To merge this PR on its own, add the full-ci label."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Build, start with --no-experimental-require-module, curl / and /admin
        run: node scripts/ci/runtime-boot-smoke.mjs

      - name: Fail on ERR_REQUIRE_ESM in the server log
        if: always()
        run: |
          if [ -f "$RUNTIME_SMOKE_LOG" ] && grep -n "ERR_REQUIRE_ESM" "$RUNTIME_SMOKE_LOG"; then
            echo "::error title=ERR_REQUIRE_ESM::a CJS dependency requires an ESM-only package; Vercel runs Node with --no-experimental-require-module"
            exit 1
          fi
