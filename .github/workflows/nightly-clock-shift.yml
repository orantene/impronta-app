# Nightly: every src/lib test with the clock moved 90 days forward.
#
# WHY: a test that reads the real clock against a fixed date flips verdict with
# no code change. On 2026-10-09 two booking-deep-link tests (slot 2026-10-09T15:00Z,
# real clock) were about to go red on main within the hour; a +90 day shifted run
# found them, and exactly them, out of ~16000 tests. The literal-date guard
# (test-fixed-dates.static.test.ts) cannot do this outside its three folders: widened
# to all of src/lib it flags 351 files that are fine because they pin their clock.
# Running the tests under a shifted clock has no false positives of that kind.
#
# Nightly only (CI is saturated; nothing here runs on pull requests or pushes).
# A shifted run that is red opens or updates ONE issue titled "clock-shift tests
# red"; green closes it. Pattern copied from nightly-all-tests.yml / main-red-alert.yml.
# Excluded (run-clock-shift.mjs): *.integration.test.* (need a database), *.manual.test.* (timing).
#
# NO SECRETS: carries no Supabase/Stripe/Resend env on purpose.

name: Nightly clock shift

on:
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Days to move the clock forward"
        required: false
        default: "90"

permissions:
  contents: read

concurrency:
  group: nightly-clock-shift
  cancel-in-progress: false

jobs:
  shifted:
    name: src/lib tests at +90 days
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Run src/lib tests with the clock shifted
        env:
          CLOCK_SHIFT_DAYS: ${{ github.event.inputs.days || '90' }}
        run: npm run ci:clock-shift

  report:
    name: Open / update / close the issue
    needs: shifted
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/github-script@v7
        env:
          RESULT: ${{ needs.shifted.result }}
        with:
          script: |
            const TITLE = "clock-shift tests red";
            const result = process.env.RESULT;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", per_page: 100,
            });
            const existing = open.find((i) => i.title === TITLE && !i.pull_request);
            if (result === "failure" || result === "timed_out") {
              const body = [
                `The nightly clock-shift run (${result}) found a test that depends on the real clock: ${runUrl}`,
                "",
                "Open the run log: the `not ok` lines name the tests. Fix by passing a fixed `now` to the code under test",
                "(see #3129 for an example), or build dates relative to `Date.now()`.",
                "Reproduce locally: `cd web && npm run ci:clock-shift` (CLOCK_SHIFT_DAYS=90 by default).",
              ].join("\n");
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number,
                  body: `Latest red run: ${runUrl}\n\n${body}`,
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner, repo: context.repo.repo, title: TITLE, body,
                });
              }
            } else if (existing && result === "success") {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number,
                body: `Clock-shift run is green again: ${runUrl}. Closing.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, state: "closed",
              });
            }
