# ─────────────────────────────────────────────────────────────────────────────
# Q.4 — Production migrations workflow (agent path for CLAUDE.md step 2).
#
# CLAUDE.md's "Schema + code shipping protocol" makes `npm run db:push`
# mandatory *before* merging any PR that adds a migration — otherwise the
# production deploy 500s on a feature whose schema was never applied. That
# script (`npx -y supabase@latest db push --linked --include-all --yes`,
# see web/package.json) needs SUPABASE_ACCESS_TOKEN + SUPABASE_DB_PASSWORD +
# SUPABASE_PROJECT_REF, none of which exist in a sandboxed agent's shell (see
# CLAUDE.md "Full deploy topology" — no Supabase credentials in most agent
# environments). This workflow is the substitute: it runs the identical
# `supabase` CLI commands against the linked production project using repo
# secrets, so an agent that cannot reach Supabase directly can still satisfy
# step 2 of the protocol before its PR merges.
#
# Required repository secrets (all three; the job fails fast if any is
# missing rather than silently no-op'ing):
#   - SUPABASE_ACCESS_TOKEN   personal/CI access token (`supabase login` equiv.)
#   - SUPABASE_DB_PASSWORD    the linked project's Postgres password
#   - SUPABASE_PROJECT_REF    the production project ref (`supabase link -p`)
#
# This workflow is workflow_dispatch-only — it never runs automatically on a
# push or PR. An agent (or a human) triggers it by hand once code + migration
# are ready, with `dry_run: true` (the default) to preview, then again with
# `dry_run: false` to actually apply. It does not touch `supabase/migrations/`
# (never edit an applied migration — see CLAUDE.md) and it does not do any
# migration-ordering or park-file handling itself: that is the responsibility
# of whoever authors the migration (see CLAUDE.md "Branch workflow" step 3,
# the park-restore pattern for timestamp collisions, and
# `web/scripts/check-migration-version-collisions.mjs`, which CI's structural
# gate already runs against local files). This workflow only pushes whatever
# is committed in `supabase/migrations/` on the ref it's run against — same
# as `db:push` would from a developer's own machine.
# ─────────────────────────────────────────────────────────────────────────────

name: DB push (production)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only (supabase db push --dry-run). Set false to actually apply pending migrations."
        type: boolean
        default: true

permissions:
  contents: read

# Only one push (or preview) against production at a time, on any ref. A
# concurrent `db push` and `db push --dry-run` could race the shadow-diff
# supabase computes, and two real pushes must never overlap on the same
# project. Queue, don't cancel — a dry-run and a real push are each too
# meaningful to just throw away.
concurrency:
  group: db-push-production
  cancel-in-progress: false

jobs:
  push:
    name: ${{ inputs.dry_run && 'Dry run' || 'Apply' }} migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, SUPABASE_PROJECT_REF
        run: |
          missing=()
          [ -z "${SUPABASE_ACCESS_TOKEN}" ] && missing+=("SUPABASE_ACCESS_TOKEN")
          [ -z "${SUPABASE_DB_PASSWORD}" ] && missing+=("SUPABASE_DB_PASSWORD")
          [ -z "${{ secrets.SUPABASE_PROJECT_REF }}" ] && missing+=("SUPABASE_PROJECT_REF")
          if [ "${#missing[@]}" -gt 0 ]; then
            for name in "${missing[@]}"; do
              echo "::error title=Missing secret::$name is not set on this repo. See CLAUDE.md 'Full deploy topology' for where these live."
            done
            exit 1
          fi
          echo "All required secrets present."

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link production project
        run: |
          supabase --version
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Migration status (before)
        id: list_before
        run: |
          echo "Migrations on disk: $(ls supabase/migrations | grep -cE '^[0-9]+_.*\.sql$')"
          echo "### DB push (production) — migration status" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Mode: **${{ inputs.dry_run && 'dry run (preview only)' || 'apply' }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "#### Local vs. remote (before)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # `supabase migration list` prints a table of every local migration
          # version alongside whether it's recorded on the linked remote
          # project — this is the authoritative applied/pending source, same
          # one a developer running `db:check`-adjacent commands would see.
          supabase migration list | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Dry run (preview pending migrations, apply nothing)
        if: ${{ inputs.dry_run }}
        run: |
          echo "#### Dry-run output" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          supabase db push --linked --include-all --dry-run | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Dry run only — nothing was applied. Re-run with \`dry_run: false\` to apply." >> "$GITHUB_STEP_SUMMARY"

      - name: Apply pending migrations
        if: ${{ !inputs.dry_run }}
        run: |
          echo "#### Apply output" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # Same invocation as `npm run db:push` in web/package.json
          # (`npx -y supabase@latest db push --linked --include-all --yes`),
          # run here via the CLI action instead of npx so behaviour matches
          # exactly what a developer's local `db:push` would do.
          supabase db push --linked --include-all --yes | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Migration status (after)
        if: ${{ !inputs.dry_run }}
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "#### Local vs. remote (after apply)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          supabase migration list | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
