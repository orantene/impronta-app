# ─────────────────────────────────────────────────────────────────────────────
# T2a — CI structural quality gate
#
# Enforces, on every PR to `main` and every push to `main`, the ratchets
# the remediation plan relies on. Without this workflow the ratchets are
# honor-system and erode the moment discipline lapses (see
# `web/docs/improvement-plan-2026-05-19-weak-dimensions.md` §Prerequisites and
# `web/docs/remediation-tracker-2026-05-19.md` row 11).
#
# Four gates, all run regardless of prior failures so a single CI run surfaces
# every break at once:
#
#   1. tsc — count `error TS####:` lines; fail if HEAD > BASE.
#   2. lint — `npm run lint` (which uses `--suppressions-location`); exit-0
#      means no new errors slipped past the baseline. No `--max-warnings 0`;
#      the 449 grandfathered warnings are ratchet-managed separately.
#   3. suppressions ratchet — sum of `count` fields in
#      `eslint-suppressions.json`; must be ≤ BASE. PRs may pay debt down (count
#      drops) but must NOT pay debt up (a new error absorbed via
#      `npm run lint:refresh-baseline` grows the count → fail).
#   4. tests — the curated test suite that `npm run ci` already invokes,
#      enumerated here so each suite's failure points at the right file. The
#      `prebuild` check-migrations-applied step is intentionally NOT invoked
#      (it needs network access to remote Supabase).
#
# Tripwire numbers below are captured from `origin/phase-1` at the tip this
# workflow was authored against (`c4f833937`, "docs(plan): improvement plan
# for 4 weakest dimensions"). When `main`'s baseline legitimately drops
# (e.g. Phase 1d cuts tsc errors to 2, or a hygiene sweep cuts suppressions),
# lower the BASE here in the same PR that proves the drop on green CI.
# Never raise BASE — that defeats the ratchet.
#
# Out of scope for T2a (explicitly): touching eslint config or suppressions
# to "make CI green"; adding a fix workflow that auto-pushes; enabling
# Vercel deploys (`vercel-post-deploy-alias.yml` handles deploy-side aliasing
# on its own trigger).
# ─────────────────────────────────────────────────────────────────────────────

name: CI — structural quality gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref so a second push to a PR doesn't
# stack up; production-branch (`main`) pushes still cancel each other but
# that's intentional — only the latest commit needs to be green.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: Structural quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    env:
      # ── BASE TRIPWIRES (lowered per landing — see per-line note) ──────
      # Bumping any of these requires a PR that demonstrably reduces the
      # underlying count first; never raise to silence a regression.
      # TSC_BASE drift note: 4 was correct at c4f833937 (PM2 baseline, all in
      # profile-shell-internal.tsx). Q1's no-explicit-any narrowing (e2447cb43)
      # surfaced 2 latent call-site mismatches (light-01.tsx:146 jumpItems.icon
      # and WorkspaceTopbar.tsx:549 items.drawer); both fixed surgically by typing
      # the array element shapes to AdminShellIconName / DrawerId | null. Count
      # restored to 4 — the 4 remaining are the original PM2 profile-shell baseline.
      TSC_BASE: 0              # was 4 (the PM2 profile-shell-internal ResolvedField baseline); LOWERED to 0 after integration's field-engine refactor moved ResolvedField + added has_value? + tenant_override? optional fields, AND profile-shell-internal.tsx decomp (Phase 1f) shipped clean. Codebase is now tsc-zero.
      SUPPRESSIONS_BASE: 7804  # PAYDOWN waves 1-3: lowered 7808→7804 after decomposing 4 of the 8 over-cap god-files under the 800-line max-lines cap and pruning their stale suppressions — contact_form/Component.tsx 828→596 (style-helpers.ts), registry-db-merge.ts 863→625 (gallery-policy.ts + catalog-admin-view.ts), catalog-playground.tsx 918→412 (playground-draft-row.tsx + playground-shared.ts), template-manager.tsx 1239→588 (template-manager-ui.tsx + template-row-card.tsx). 4 remain over cap (catalog-row-table 1996 / component-catalog 1630 / catalog-starter-kit 1574 / registry-actions 1180) → later waves drop BASE further toward 7802. PRIOR: reconciled 7802→7808 to the true committed floor (the +6 drift — +8 max-lines from #616/#495 minus -2 inline-style — had been masked red behind the also-red builder lanes; several merges landed on an already-red main). BASE always = the EXACT current committed count (this gate's own algorithm: sum of x[f][r].count), zero slack, so the ratchet still fails on the NEXT new suppression. Earlier history: 8020→7802 (platform-health WS-E; 8020 had sat ~218 above reality). Never raise BASE *above* the committed count to silence a regression.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22.x
        uses: actions/setup-node@v4
        with:
          # package.json `engines.node` = ">=22.0.0 <25.0.0".
          # `.nvmrc` says 20.20.2 but that's stale (predates the Next 15 /
          # React 19 bump); package.json is the source of truth.
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies (npm ci)
        run: npm ci

      # ── Gate 1: TypeScript error-count ratchet ───────────────────────
      - name: tsc — error count ≤ BASE
        if: ${{ !cancelled() }}
        run: |
          set +e
          # Bump heap: the full-project tsc exceeds the default ~2GB and was
          # OOM-exiting (134) mid-compile, making the ratchet a false-green (it
          # counted 0 errors before the heap died). 8GB lets tsc finish so the
          # error count is real.
          tsc_output=$(NODE_OPTIONS="--max-old-space-size=8192" npx tsc --noEmit 2>&1)
          tsc_exit=$?
          set -e
          # Match the primary error line; TS sometimes prints multi-line
          # "related info" but only the primary line has `error TS####:`.
          error_count=$(printf '%s\n' "$tsc_output" | grep -cE 'error TS[0-9]+:' || true)
          echo "tsc exit=$tsc_exit  errors=$error_count  BASE=$TSC_BASE"
          # Print last 80 lines so CI shows what failed without dumping the
          # whole compilation log on success.
          printf '%s\n' "$tsc_output" | tail -80
          echo "::notice title=tsc ratchet::HEAD=$error_count  BASE=$TSC_BASE"
          if [ "$error_count" -gt "$TSC_BASE" ]; then
            echo "::error title=tsc regression::HEAD has $error_count tsc error(s); BASE is $TSC_BASE. This PR introduces new type errors. Fix them, or — if you genuinely reduced BASE — lower TSC_BASE in .github/workflows/ci.yml in the same PR."
            exit 1
          fi

      # ── Gate 2: ESLint baseline (--suppressions-location ratchet) ────
      # `npm run lint` already passes `--suppressions-location
      # eslint-suppressions.json`, which silently absorbs grandfathered
      # errors and reports only NEW ones. Exit-0 means clean against the
      # baseline. We do NOT pass `--max-warnings 0` — 449 warnings are
      # tracked separately via the suppressions ratchet.
      - name: lint — no new errors past the baseline
        if: ${{ !cancelled() }}
        run: npm run lint

      # ── Gate 3: Suppressions JSON monotone-decreasing ────────────────
      # The actual T2a win: a PR can pay lint debt down (count drops) but
      # MUST NOT pay debt up. `npm run lint:refresh-baseline` regenerates
      # the JSON to absorb any new errors — without this gate, that script
      # silently grows the baseline and the ratchet is defeated.
      - name: suppressions — eslint-suppressions.json total ≤ BASE
        if: ${{ !cancelled() }}
        run: |
          count=$(node -e "
            const x = require('./eslint-suppressions.json');
            let n = 0;
            for (const f of Object.keys(x)) {
              for (const r of Object.keys(x[f])) {
                n += (x[f][r].count || 0);
              }
            }
            console.log(n);
          ")
          echo "eslint-suppressions.json total=$count  BASE=$SUPPRESSIONS_BASE"
          echo "::notice title=suppressions ratchet::HEAD=$count  BASE=$SUPPRESSIONS_BASE"
          if [ "$count" -gt "$SUPPRESSIONS_BASE" ]; then
            echo "::error title=suppressions regression::eslint-suppressions.json grew from $SUPPRESSIONS_BASE → $count. This PR adds new lint debt via the suppressions baseline (typically via npm run lint:refresh-baseline absorbing a new error). Fix the underlying lint error so it doesn't need suppressing, or contest the BASE via the remediation tracker."
            exit 1
          fi

      # ── Gate 4: Tests ────────────────────────────────────────────────
      # The same suites the canonical `npm run ci` script invokes, minus
      # `check:migrations-applied` (network) and `build` (out of T2a scope
      # — Vercel handles deploy-side build). Each script runs separately
      # so a failure surfaces the exact suite.
      - name: tests — phase1-i18n
        if: ${{ !cancelled() }}
        run: npm run test:phase1-i18n

      - name: tests — locale-precedence
        if: ${{ !cancelled() }}
        run: npm run test:locale-precedence

      - name: tests — inquiry-workspace
        if: ${{ !cancelled() }}
        run: npm run test:inquiry-workspace

      - name: tests — ai-guardrails
        if: ${{ !cancelled() }}
        run: npm run test:ai-guardrails

      - name: tests — tenant-isolation
        if: ${{ !cancelled() }}
        run: npm run test:tenant-isolation

      - name: tests — builder-capabilities
        if: ${{ !cancelled() }}
        run: npm run test:builder-capabilities

      - name: tests — builder-node-bindings
        if: ${{ !cancelled() }}
        run: npm run test:builder-node-bindings

      # The big builder-lab + page-builder suite (1200+ node tests) + the
      # builder-chrome suite. Both are in the `npm run ci` aggregate but Actions
      # only runs this curated step list, so they never gated a PR — a behavioral
      # regression in the builder/catalog/page-roles logic could land on main
      # green. Wired in here (verified green on main at the time of this change).
      - name: tests — builder
        if: ${{ !cancelled() }}
        run: npm run test:builder

      - name: tests — builder-chrome
        if: ${{ !cancelled() }}
        run: npm run test:builder-chrome

      - name: tests — node-presentation
        if: ${{ !cancelled() }}
        run: npm run test:node-presentation

      - name: tests — publish-preflight
        if: ${{ !cancelled() }}
        run: npm run test:publish-preflight

      # ── Money / content lanes ─────────────────────────────────────────
      # These four lanes were in the `npm run ci` aggregate but NOT in this
      # curated step list, so they never gated a PR (the same drift that hid
      # test:builder). For a payments product, test:money/billing not gating is
      # the highest-risk gap; check:ci-lane-parity (below) now prevents recurrence.
      - name: tests — billing
        if: ${{ !cancelled() }}
        run: npm run test:billing

      - name: tests — money
        if: ${{ !cancelled() }}
        run: npm run test:money

      - name: tests — fields
        if: ${{ !cancelled() }}
        run: npm run test:fields

      - name: tests — notifications
        if: ${{ !cancelled() }}
        run: npm run test:notifications

      - name: tests — reviews
        if: ${{ !cancelled() }}
        run: npm run test:reviews

      # ── Component test gate (10th test step) ─────────────────────────
      # Vitest + @testing-library/react + jsdom. Smoke tests for the
      # top god-files (primitives, profile-shell-internal, WorkspacePageView,
      # media-page, edit-context). A red signal means a recent refactor
      # broke the render shape of a foundational component.
      #
      # See web/docs/test-infrastructure.md for stack rationale and the
      # rule against bloating this lane with "high coverage" tests —
      # smoke-level only; expand via a separate lane.
      - name: tests — components (vitest smoke)
        if: ${{ !cancelled() }}
        run: npm run test:components

      # ── CI lane parity ───────────────────────────────────────────────
      # This curated step list is NOT `npm run ci` — Actions invokes the steps
      # above one by one. When a `test:*` lane is added to the `ci` aggregate
      # but not here, it silently never gates (test:builder + 5 money/content
      # lanes drifted that way). This guard fails red the moment that recurs.
      - name: verify — ci.yml gates every `npm run ci` test lane
        if: ${{ !cancelled() }}
        run: npm run check:ci-lane-parity

      # ── Gate 5: Server-action bundle safety ──────────────────────────
      # tsc/tsx/lint are STRUCTURALLY BLIND to non-async exports and
      # value/type re-exports in "use server" files — they pass the gate yet
      # break `next build` (SWC server-actions codegen) and 500 at runtime.
      # Two such breakers shipped to a prod deploy before this gate existed
      # (see web/docs/builder-lab-completion-audit-2026.md). Cheap static guard.
      - name: verify — server-action export rules ("use server" files)
        if: ${{ !cancelled() }}
        run: npm run verify:server-actions

      # ── Gate 6: Production build (catch-all bundle gate) ─────────────
      # The ONLY step that exercises the real SWC bundle the way Vercel does, so
      # `main` refuses bundle-time breakers tsc/tsx never see. Runs `next build`
      # directly to skip the network-bound `prebuild` migration check; the
      # placeholder public env keeps module-eval happy without secrets (server
      # env is read at runtime, not build).
      - name: build — next production build (bundle gate)
        if: ${{ !cancelled() }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NODE_OPTIONS: --max-old-space-size=8192
        run: npx next build
