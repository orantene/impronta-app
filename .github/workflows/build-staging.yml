# "Build staging" BUTTON. MANUAL ONLY (workflow_dispatch). Moves the `staging` POINTER branch to a main
# commit whose structural gate is green, then waits for the Vercel Git build of the `staging` ref (a
# PREVIEW deployment, target null) and points the STAGING hosts at it. It NEVER creates, promotes or
# aliases anything production: no `target: production`, no `vercel promote`, no tulala.digital /
# app.tulala.digital / impronta.tulala.digital alias, and it does not touch the production alias guard.
#
# Why a pointer (TUL-1765 / TUL-1768): web/vercel.json `ignoreCommand` builds only the `production` and
# `staging` refs, so a merge to `main` builds nothing. Moving `staging` is the ONE trigger and costs ONE
# build; there is no on/off env switch (STAGING_BUILD is gone) and no flag that could auto-build every merge.
# The pointer is moved only by this workflow, the way promote-production.yml moves `production`:
#   1. resolve the SHA (input, else head of origin/main) and refuse anything not an ancestor of origin/main
#   2. require a SUCCESSFUL `CI — structural quality gate` run on that exact SHA (a red or unknown gate is refused)
#   3. fast-forward `staging` to the SHA: a plain push, never forced, never backwards. The push is what makes
#      Vercel build; a SHA the pointer is already at builds nothing and re-uses its existing deployment
#   4. find the Vercel deployment for that SHA on the `staging` ref (bounded wait), refuse a production target
#   5. wait for READY (bounded), fail loudly on ERROR / CANCELED
#   6. alias the staging hosts (STAGING_HOSTS below, staging only) to that deployment
#   7. probe the live bundle: fxlank staging DB ref present; pluhda (prod) ref and pk_live_ absent; / is 200
#   8. npm run deploy:smoke -- --staging (staging mode of the smoke script)
# Setup (Vercel env scope, branch protection): web/docs/vercel-staging-build.md.
#
# Secrets: VERCEL_TOKEN and STAGING_GATE_CI_TOKEN (both required; the gate page returns 200 for
# everyone, the app bundle is only reachable with the token). Optional:
# VERCEL_AUTOMATION_BYPASS_SECRET (Vercel deployment protection bypass). Secrets are only passed through
# `env:`, masked, and sent as request headers; never echoed. Pinned by
# web/src/lib/quality/build-staging-workflow.static.test.ts.
name: Build staging

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "main commit SHA to build (blank = current head of main)"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: build-staging
  cancel-in-progress: false

env:
  GATE_WORKFLOW: "CI — structural quality gate"
  VERCEL_TEAM_ID: team_otRX11wclvw89c5ls7A7UsZd
  VERCEL_PROJECT_ID: prj_oM9OZ4CLewpMPxpKfkacWs9nRcA2
  VERCEL_PROJECT_NAME: tulala
  # Staging hosts ONLY. The test pins that every entry is a staging host.
  STAGING_HOSTS: "staging.tulala.digital www.staging.tulala.digital app.staging.tulala.digital hub.staging.tulala.digital pay.staging.tulala.digital marketing.staging.tulala.digital support.staging.tulala.digital impronta.staging.tulala.digital taqueria.staging.tulala.digital qa-branded-agency.staging.tulala.digital staging-qa-app.tulala.digital staging-qa-journeys.tulala.digital staging-qa-journeys-b.tulala.digital staging-qa-marketing.tulala.digital"
  STAGING_PRIMARY_HOST: staging.tulala.digital
  # Supabase project refs (docs/plans/live-qa-runbook.md, OPERATING.md).
  FXLANK_REF: fxlankepwnvelxjrahwk
  PLUHDA_REF: pluhdapdnuiulvxmyspd

jobs:
  build-staging:
    name: Build main to staging
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      STAGING_GATE_CI_TOKEN: ${{ secrets.STAGING_GATE_CI_TOKEN }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Mask secrets
        run: |
          for v in "$VERCEL_TOKEN" "$STAGING_GATE_CI_TOKEN" "$VERCEL_AUTOMATION_BYPASS_SECRET"; do
            if [ -n "$v" ]; then echo "::add-mask::$v"; fi
          done
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN repo secret is not set"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve SHA and require it to be on main
        id: sha
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          HEAD_SHA="$(git rev-parse origin/main)"
          SHA="${INPUT_SHA:-$HEAD_SHA}"
          if ! printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::sha must be a full 40-hex commit SHA, got: $SHA"
            exit 1
          fi
          if ! git cat-file -e "$SHA^{commit}" 2>/dev/null; then
            echo "::error::$SHA is not a commit in this repository"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::$SHA is not an ancestor of origin/main. Only main commits can be built to staging."
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Building $SHA (main head is $HEAD_SHA)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Require a green structural gate on that SHA
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          OK="$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$SHA&status=success&per_page=100" \
            --jq "[.workflow_runs[] | select(.name == \"$GATE_WORKFLOW\")] | length")"
          if [ "$OK" = "0" ]; then
            echo "::error::Refusing to build $SHA: the structural quality gate has not succeeded on it."
            exit 1
          fi
          echo "gate green on $SHA" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Fast-forward the staging pointer (this push is the one build trigger)
        id: pointer
        env:
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          if git fetch origin staging 2>/dev/null; then
            if [ "$(git rev-parse origin/staging)" = "$SHA" ]; then
              echo "moved=false" >> "$GITHUB_OUTPUT"
              echo "staging already at $SHA: no push, no new build; re-using its deployment" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if git merge-base --is-ancestor "$SHA" origin/staging; then
              echo "::error::staging is already past $SHA. The pointer never moves backwards."
              exit 1
            fi
            if ! git merge-base --is-ancestor origin/staging "$SHA"; then
              echo "::error::$SHA is not a fast-forward of staging. Refusing to move the pointer."
              exit 1
            fi
          else
            echo "::notice::staging does not exist yet: creating it at $SHA"
          fi
          # Plain push, no force: git rejects anything but a fast-forward.
          git push origin "$SHA:refs/heads/staging"
          echo "moved=true" >> "$GITHUB_OUTPUT"
          echo "staging -> $SHA (green gate)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Find the Vercel build of the staging ref
        id: deploy
        env:
          SHA: ${{ steps.sha.outputs.sha }}
          MOVED: ${{ steps.pointer.outputs.moved }}
        run: |
          set -euo pipefail
          tries=40
          if [ "$MOVED" != "true" ]; then tries=2; fi
          for i in $(seq 1 "$tries"); do
            curl -sS "https://api.vercel.com/v6/deployments?projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_TEAM_ID}&meta-githubCommitSha=${SHA}&limit=20" \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" -o /tmp/list.json
            id="$(jq -r --arg sha "$SHA" '[.deployments[]? | select(.meta.githubCommitRef=="staging" and .meta.githubCommitSha==$sha)] | sort_by(.created) | last | .uid // empty' /tmp/list.json)"
            if [ -n "$id" ]; then break; fi
            echo "no staging deployment for $SHA yet ($i/$tries)"
            sleep 15
          done
          if [ -z "${id:-}" ]; then
            echo "::error::No Vercel deployment of the staging ref for $SHA. Check that the commit carries the ignoreCommand that builds staging and that the staging Preview env is scoped to branch staging (web/docs/vercel-staging-build.md)."
            exit 1
          fi
          curl -sS "https://api.vercel.com/v13/deployments/${id}?teamId=${VERCEL_TEAM_ID}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" -o /tmp/deploy.json
          tgt="$(jq -r '.target // "preview"' /tmp/deploy.json)"
          if [ "$tgt" = "production" ]; then
            echo "::error::Deployment $id came back as production. Refusing to continue."
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "Deployment $id found (target: $tgt)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Wait for READY
        env:
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.id }}
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            state="$(curl -sS "https://api.vercel.com/v13/deployments/${DEPLOYMENT_ID}?teamId=${VERCEL_TEAM_ID}" \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" | jq -r '.readyState // "UNKNOWN"')"
            echo "state: $state"
            case "$state" in
              READY) exit 0 ;;
              ERROR|CANCELED) echo "::error::Build finished as $state"; exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::Timed out waiting for READY (30 min)"
          exit 1

      - name: Alias the staging hosts
        env:
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.id }}
        run: |
          set -euo pipefail
          for host in $STAGING_HOSTS; do
            case "$host" in
              staging.tulala.digital|*.staging.tulala.digital|staging-qa-*.tulala.digital) ;;
              *) echo "::error::$host is not a staging host; refusing to alias"; exit 1 ;;
            esac
            code="$(curl -sS -o /tmp/alias.json -w '%{http_code}' -X POST \
              "https://api.vercel.com/v2/deployments/${DEPLOYMENT_ID}/aliases?teamId=${VERCEL_TEAM_ID}" \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" -H 'Content-Type: application/json' \
              --data "$(jq -nc --arg a "$host" '{alias:$a}')")"
            if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
              echo "::error::Aliasing $host failed (HTTP $code): $(jq -r '.error.message // empty' /tmp/alias.json)"
              exit 1
            fi
            echo "aliased $host"
          done

      - name: Probe the built bundle (staging DB only, no prod ref, no live key)
        run: |
          set -euo pipefail
          if [ -z "$STAGING_GATE_CI_TOKEN" ]; then
            echo "::error::STAGING_GATE_CI_TOKEN repo secret is required for the bundle probe (without it only the gate page is reachable, which proves nothing)"
            exit 1
          fi
          hdr=(-H "x-staging-gate-token: ${STAGING_GATE_CI_TOKEN}")
          if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then hdr+=(-H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}"); fi
          base="https://${STAGING_PRIMARY_HOST}"
          code="$(curl -sS -o /tmp/root.html -w '%{http_code}' "${hdr[@]}" "$base/")"
          if [ "$code" != "200" ]; then
            echo "::error::GET / returned $code (expected 200)"
            exit 1
          fi
          : > /tmp/bundle.txt
          grep -Eo '/_next/static/[^"'"'"' )]+\.js' /tmp/root.html | sort -u | head -80 > /tmp/chunks.txt
          n="$(wc -l < /tmp/chunks.txt | tr -d ' ')"
          if [ "$n" -eq 0 ]; then
            echo "::error::No JS chunks found on the staging root: gate page or wrong deployment. A 200 gate page is NOT a pass."
            exit 1
          fi
          while read -r path; do
            ccode="$(curl -sS -o /tmp/chunk.js -w '%{http_code}' "${hdr[@]}" "${base}${path}")"
            if [ "$ccode" != "200" ]; then
              echo "::error::chunk ${path} returned $ccode (token rejected or deployment broken)"
              exit 1
            fi
            cat /tmp/chunk.js >> /tmp/bundle.txt
          done < /tmp/chunks.txt
          echo "probed $n chunks"
          if ! grep -q "$FXLANK_REF" /tmp/bundle.txt; then
            echo "::error::fxlank staging Supabase ref ($FXLANK_REF) NOT found in any JS chunk fetched with the gate token: wrong env or gate page only"
            exit 1
          fi
          if grep -q "$PLUHDA_REF" /tmp/bundle.txt; then
            echo "::error::PRODUCTION Supabase ref ($PLUHDA_REF) found in the staging bundle. Do not use this staging build."
            exit 1
          fi
          if grep -q 'pk_live_' /tmp/bundle.txt; then
            echo "::error::A live Stripe publishable key (pk_live_) is in the staging bundle. Do not use this staging build."
            exit 1
          fi
          echo "bundle probe ok: fxlank present, pluhda absent, no pk_live_" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Staging smoke
        env:
          SMOKE_EXPECT_SHA: ${{ steps.sha.outputs.sha }}
        working-directory: web
        run: npm run deploy:smoke -- --staging --host "https://${STAGING_PRIMARY_HOST}"
