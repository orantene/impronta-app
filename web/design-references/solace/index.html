<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<title>Solace · Valeria Ortiz (DRAFT)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Inter:wght@400;500;600&family=Geist:wght@500;600&display=swap">
<style>
.site{--k-fd:'Cormorant Garamond',Georgia,serif;--k-fb:'Inter',system-ui,sans-serif;--k-fdw:300;--k-fdls:-.01em;--k-rad:18px;--k-btnrad:999px;--k-dockrad:999px}
.so-cover{position:relative;min-height:600px;display:grid;align-items:end;overflow:hidden;background:var(--k-tint)}
.so-cover>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.so-cover>img.wide{display:none}
.so-cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.28) 0%,rgba(0,0,0,0) 30%,rgba(0,0,0,.42) 100%)}
.so-nav{position:absolute;top:44px;left:0;right:0;z-index:2;display:flex;align-items:center;gap:10px;padding:14px 18px;color:#fff}
.so-nav b{font:400 22px var(--k-fd);letter-spacing:.01em}
.so-nav nav{display:none;gap:26px;font:500 13px var(--k-fb)}
.so-nav nav a{color:#fff;text-decoration:none;cursor:pointer;opacity:.9}
.so-nav .sp{flex:1}
.so-in{position:relative;z-index:1;padding:0 18px 104px;color:#fff;display:grid;gap:14px}
.so-in small{font:500 12px var(--k-fb);letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.so-in h1{margin:0;font:300 52px/1 var(--k-fd);letter-spacing:-.01em;max-width:11ch}
.so-in .row{display:flex;gap:8px;flex-wrap:wrap}
.so-in .k-btn.ghost{color:#fff;border-color:rgba(255,255,255,.7)}
.so-about{padding:72px 22px 0;text-align:center;display:grid;justify-items:center;gap:14px}
.so-about small,.so-svc small.ey,.so-space small,.so-end small{font:500 12px var(--k-fb);letter-spacing:.14em;text-transform:uppercase;color:var(--k-mute)}
.so-about p{margin:0;max-width:30ch;font:300 26px/1.35 var(--k-fd)}
.so-svc{padding:80px 22px 0;display:grid;gap:8px}
.so-svc h2,.so-space h2,.so-end h2{margin:0;font:300 40px/1.05 var(--k-fd)}
.so-row{display:grid;grid-template-columns:76px 1fr;gap:16px;align-items:center;padding:20px 0;border-top:1px solid var(--k-line);cursor:pointer}
.so-row:last-child{border-bottom:1px solid var(--k-line)}
.so-row img{width:76px;height:76px;border-radius:50%;object-fit:cover}
.so-row b{display:block;font:400 24px/1.15 var(--k-fd)}
.so-row p{margin:4px 0 10px;color:var(--k-mute);font-size:14px;line-height:1.5}
.so-row .f{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.so-row .p{font:500 14px var(--k-fb)}
.so-space{padding:80px 22px 0;display:grid;gap:14px}
.so-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.so-pair img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:var(--k-rad)}
.so-end{margin-top:80px;padding:56px 22px 130px;background:var(--k-surface);text-align:center;display:grid;justify-items:center;gap:14px}
.so-end p{margin:0;color:var(--k-mute);max-width:34ch}
.so-faq{width:100%;max-width:560px;text-align:left;margin-top:18px}
.so-faq details{border-top:1px solid var(--k-line);padding:14px 0}
.so-faq details:last-child{border-bottom:1px solid var(--k-line)}
.so-faq summary{cursor:pointer;font:400 20px var(--k-fd);list-style:none}
.so-faq p{margin:8px 0 0;max-width:none}
.so-end .fine{margin-top:26px;font:500 11px var(--k-fb);letter-spacing:.12em;text-transform:uppercase;color:var(--k-mute)}
@container site (min-width:900px){
  .so-nav{top:0;padding:22px 48px}
  .so-nav nav{display:flex}
  .so-in{padding:0 48px 64px}
  .so-cover{min-height:720px}
  .so-cover>img.wide{display:block}
  .so-cover>img.tall{display:none}
  .so-in h1{font-size:96px}
  .so-about{padding:120px 48px 0}
  .so-about p{font-size:38px}
  .so-svc{padding:120px 48px 0;max-width:820px;margin:0 auto}
  .so-svc h2,.so-space h2,.so-end h2{font-size:56px}
  .so-row{grid-template-columns:110px 1fr;gap:28px;padding:28px 0}
  .so-row img{width:110px;height:110px}
  .so-row b{font-size:30px}
  .so-space{padding:120px 48px 0}
  .so-pair{gap:18px}
  .so-pair img{aspect-ratio:4/5}
  .so-end{margin-top:120px;padding:96px 48px 140px}
}
</style>
