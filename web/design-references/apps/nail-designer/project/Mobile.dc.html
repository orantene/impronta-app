<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nail Studio — mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&amp;display=swap">
<style>
body{margin:0;background:#F3ECE6;color:#2B2221;font-family:'DM Sans',system-ui,sans-serif}
button{font-family:inherit}
button:focus-visible,input:focus-visible{outline:2px solid #A63D57;outline-offset:2px}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;background:#FFFCFA;color:#2B2221;font-family:'DM Sans',system-ui,sans-serif;overflow:hidden;">
<header style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 12px;background:#F3ECE6;">
<div style="font-family:'Fraunces',Georgia,serif;font-size:26px;font-weight:500;letter-spacing:-0.01em;color:#2B2221;">Nail <span style="font-style:italic;color:{{accent}};">Studio</span></div>
<div style="display:flex;gap:6px;">
<button onClick="{{undo}}" disabled="{{noUndo}}" aria-label="Undo" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;padding:0;border:1px solid #DCCFC6;border-radius:50%;background:#FFFCFA;color:#2B2221;cursor:pointer;opacity:{{undoOpacity}};"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width:2;stroke-linecap:round;stroke-linejoin:round;" aria-hidden="true"><path d="M9 14 4 9l5-5"></path><path d="M4 9h11a5 5 0 0 1 0 10h-3"></path></svg></button>
<button onClick="{{reset}}" aria-label="Reset" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;padding:0;border:1px solid #DCCFC6;border-radius:50%;background:#FFFCFA;color:#2B2221;cursor:pointer;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width:2;stroke-linecap:round;stroke-linejoin:round;" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path></svg></button>
</div>
</header>
<div style="padding:0 16px 14px;background:#F3ECE6;">
<div style="position:relative;height:300px;border-radius:24px;background:#EADFD6;overflow:hidden;">
<div style="position:absolute;top:12px;left:12px;display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:#FFFCFA;font-size:12px;font-weight:600;color:#2B2221;box-shadow:0 1px 2px rgba(43,34,33,.08);">
<span style="width:8px;height:8px;border-radius:50%;background:{{accent}};"></span>Editing · {{editingLabel}}</div>
<div style="position:absolute;left:0;right:0;bottom:-52px;display:flex;align-items:flex-end;justify-content:center;gap:10px;">
<sc-for list="{{fingers}}" as="f" hint-placeholder-count="5">
<div style="position:relative;flex-shrink:0;width:{{f.w}}px;height:{{f.h}}px;transform:{{f.transform}};transform-origin:50% 100%;">
<div style="position:absolute;inset:0;background:{{skin}};border-radius:{{f.fingerRadius}};box-shadow:inset -10px 0 18px rgba(60,30,20,.12), inset 6px 0 10px rgba(255,255,255,.18);"></div>
<div style="position:absolute;left:24%;right:24%;top:{{f.crease}}px;height:12px;border-top:2px solid rgba(60,30,20,.12);border-radius:50%;"></div>
<button onClick="{{f.pick}}" aria-label="{{f.label}}" aria-pressed="{{f.on}}" style="position:absolute;left:50%;top:{{f.nailTop}}px;margin-left:{{f.ml}}px;width:{{f.nw}}px;height:{{f.nh}}px;padding:0;border:0;background:rgba(0,0,0,0);cursor:pointer;border-radius:{{radius}};outline:{{f.outline}};outline-offset:6px;">
<span style="position:absolute;inset:0;display:block;border-radius:{{radius}};clip-path:{{clip}};background:{{f.bg}};box-shadow:inset 0 -3px 0 rgba(0,0,0,.10), inset 0 0 0 1px rgba(0,0,0,.06);overflow:hidden;"><span style="position:absolute;inset:0;display:block;background:{{f.shine}};"></span></span>
<span style="position:absolute;left:{{f.stLeft}}px;top:{{f.stTop}}px;width:{{f.stW}}px;height:{{f.stW}}px;display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25));">
<sc-if value="{{f.isGem}}" hint-placeholder-val="{{false}}"><svg viewBox="0 0 24 24" width="100%" height="100%" aria-hidden="true"><polygon points="12,2 20,9 12,22 4,9" fill="#E6F4FF" stroke="#8DB6D1"></polygon><polygon points="12,2 15.5,9 12,22 8.5,9" fill="#FFFFFF"></polygon><polyline points="4,9 20,9" fill="none" stroke="#8DB6D1"></polyline></svg></sc-if>
<sc-if value="{{f.isStar}}" hint-placeholder-val="{{false}}"><svg viewBox="0 0 24 24" width="100%" height="100%" aria-hidden="true"><polygon points="12,2 14.9,8.6 22,9.3 16.6,14 18.2,21 12,17.3 5.8,21 7.4,14 2,9.3 9.1,8.6" fill="#EBC75E" stroke="#B48A26"></polygon></svg></sc-if>
<sc-if value="{{f.isHeart}}" hint-placeholder-val="{{false}}"><svg viewBox="0 0 24 24" width="100%" height="100%" aria-hidden="true"><path d="M12 21 C5 16.5 2 12.8 2 8.8 C2 5.6 4.5 3.5 7.2 3.5 C9.3 3.5 11 4.8 12 6.6 C13 4.8 14.7 3.5 16.8 3.5 C19.5 3.5 22 5.6 22 8.8 C22 12.8 19 16.5 12 21 Z" fill="#FFF6F4" stroke="#C9A7A0"></path></svg></sc-if>
<sc-if value="{{f.isFlower}}" hint-placeholder-val="{{false}}"><svg viewBox="0 0 24 24" width="100%" height="100%" aria-hidden="true"><circle cx="12" cy="6.5" r="4" fill="#FFFFFF" stroke="#E2D6D0"></circle><circle cx="17.2" cy="10.3" r="4" fill="#FFFFFF" stroke="#E2D6D0"></circle><circle cx="15.2" cy="16.4" r="4" fill="#FFFFFF" stroke="#E2D6D0"></circle><circle cx="8.8" cy="16.4" r="4" fill="#FFFFFF" stroke="#E2D6D0"></circle><circle cx="6.8" cy="10.3" r="4" fill="#FFFFFF" stroke="#E2D6D0"></circle><circle cx="12" cy="12" r="2.8" fill="#F2C14E"></circle></svg></sc-if>
<sc-if value="{{f.isPearls}}" hint-placeholder-val="{{false}}"><svg viewBox="0 0 24 24" width="100%" height="100%" aria-hidden="true"><circle cx="7.5" cy="6" r="3.6" fill="#FBF7EE" stroke="#D2C4AE"></circle><circle cx="12" cy="12.2" r="3.2" fill="#FBF7EE" stroke="#D2C4AE"></circle><circle cx="16.5" cy="18.2" r="2.8" fill="#FBF7EE" stroke="#D2C4AE"></circle></svg></sc-if>
</span>
</button>
</div>
</sc-for>
</div>
<sc-if value="{{hasToast}}" hint-placeholder-val="{{false}}"><div style="position:absolute;top:12px;right:12px;padding:10px 16px;border-radius:999px;background:#2B2221;color:#FFFCFA;font-size:12px;font-weight:500;">{{toast}}</div></sc-if>
</div>
</div>
<div style="display:flex;flex-direction:column;gap:10px;padding:14px 16px 0;">
<div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:4px;padding:4px;border-radius:999px;background:#F1E8E2;">
<button onClick="{{setAll}}" style="height:40px;border:0;border-radius:999px;background:{{segAllBg}};color:{{segAllFg}};font-size:14px;font-weight:600;cursor:pointer;">All nails</button>
<button onClick="{{setOne}}" style="height:40px;border:0;border-radius:999px;background:{{segOneBg}};color:{{segOneFg}};font-size:14px;font-weight:600;cursor:pointer;">{{oneLabel}}</button>
</div>
<div style="display:grid;grid-template-columns:repeat(6, minmax(0, 1fr));border-bottom:1px solid #EFE6DF;">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="6"><button onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="height:44px;padding:0;border:0;border-bottom:2px solid {{t.line}};background:rgba(0,0,0,0);color:{{t.fg}};font-size:13px;font-weight:600;cursor:pointer;">{{t.label}}</button></sc-for>
</div>
</div>
<div style="flex-grow:1;min-height:0;overflow-y:auto;padding:18px 16px 20px;">
<sc-if value="{{isColor}}" hint-placeholder-val="{{true}}"><div style="display:flex;flex-direction:column;gap:28px;"><div style="display:flex;flex-direction:column;gap:12px;"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;"><h3 style="margin:0;font-size:15px;font-weight:600;color:#2B2221;">Polish</h3><span style="font-size:13px;color:#6E5F5B;">{{c1Name}}</span></div><div style="display:grid;grid-template-columns:repeat(6, minmax(0, 1fr));gap:10px;">
<sc-for list="{{colors}}" as="c" hint-placeholder-count="18">
<button onClick="{{c.pick}}" aria-label="{{c.label}}" aria-pressed="{{c.on}}" title="{{c.name}}" style="width:100%;aspect-ratio:1;min-height:44px;padding:0;border:0;border-radius:50%;background:{{c.hex}};box-shadow:{{c.ring}};cursor:pointer;"></button>
</sc-for>
</div><label style="display:flex;align-items:center;gap:12px;font-size:14px;color:#2B2221;cursor:pointer;"><input type="color" value="{{c1Hex}}" onChange="{{setC1Custom}}" style="width:44px;height:44px;padding:3px;border:1px solid #E6DAD2;border-radius:12px;background:#FFFFFF;cursor:pointer;">Mix a custom polish</label></div><div style="display:flex;flex-direction:column;gap:12px;"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;"><h3 style="margin:0;font-size:15px;font-weight:600;color:#2B2221;">Accent</h3><span style="font-size:13px;color:#6E5F5B;">{{c2Name}}</span></div><p style="margin:0;font-size:13px;line-height:1.45;color:#6E5F5B;">Used for tips, dots, stripes, moons and marbling.</p><div style="display:grid;grid-template-columns:repeat(6, minmax(0, 1fr));gap:10px;">
<sc-for list="{{colors2}}" as="c" hint-placeholder-count="18">
<button onClick="{{c.pick}}" aria-label="{{c.label}}" aria-pressed="{{c.on}}" title="{{c.name}}" style="width:100%;aspect-ratio:1;min-height:44px;padding:0;border:0;border-radius:50%;background:{{c.hex}};box-shadow:{{c.ring}};cursor:pointer;"></button>
</sc-for>
</div><label style="display:flex;align-items:center;gap:12px;font-size:14px;color:#2B2221;cursor:pointer;"><input type="color" value="{{c2Hex}}" onChange="{{setC2Custom}}" style="width:44px;height:44px;padding:3px;border:1px solid #E6DAD2;border-radius:12px;background:#FFFFFF;cursor:pointer;">Mix a custom accent</label></div></div></sc-if>
<sc-if value="{{isArt}}" hint-placeholder-val="{{false}}"><div style="display:flex;flex-direction:column;gap:12px;"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;"><h3 style="margin:0;font-size:15px;font-weight:600;color:#2B2221;">Nail art</h3></div><div style="display:grid;grid-template-columns:repeat(4, minmax(0, 1fr));gap:10px;">
<sc-for list="{{patterns}}" as="p" hint-placeholder-count="8"><button onClick="{{p.pick}}" aria-pressed="{{p.on}}" style="display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px;min-height:44px;padding:14px 4px 10px;border:1px solid {{p.border}};border-radius:16px;background:{{p.tileBg}};cursor:pointer;color:#2B2221;font-size:12px;font-weight:500;"><span style="position:relative;display:block;width:34px;height:50px;border-radius:50% 50% 46% 46% / 40% 40% 24% 24%;background:{{p.bg}};box-shadow:inset 0 -2px 0 rgba(0,0,0,.08), inset 0 0 0 1px rgba(0,0,0,.06);overflow:hidden;"><span style="position:absolute;inset:0;display:block;background:{{p.shine}};"></span></span>{{p.name}}</button></sc-for>
</div></div></sc-if>
<sc-if value="{{isFinish}}" hint-placeholder-val="{{false}}"><div style="display:flex;flex-direction:column;gap:12px;"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;"><h3 style="margin:0;font-size:15px;font-weight:600;color:#2B2221;">Finish</h3></div><div style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:10px;">
<sc-for list="{{finishes}}" as="p" hint-placeholder-count="5"><button onClick="{{p.pick}}" aria-pressed="{{p.on}}" style="display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px;min-height:44px;padding:14px 4px 10px;border:1px solid {{p.border}};border-radius:16px;background:{{p.tileBg}};cursor:pointer;color:#2B2221;font-size:12px;font-weight:500;"><span style="position:relative;display:block;width:40px;height:58px;border-radius:50% 50% 46% 46% / 40% 40% 24% 24%;background:{{p.bg}};box-shadow:inset 0 -2px 0 rgba(0,0,0,.08), inset 0 0 0 1px rgba(0,0,0,.06);overflow:hidden;"><span style="position:absolute;inset:0;display:block;background:{{p.shine}};"></span></span>{{p.name}}</button></sc-for>
</div></div></sc-if>
<sc-if value="{{isShape}}" hint-placeholder-val="{{false}}"><div style="display:flex;flex-direction:column;gap:28px;"><div style="display:flex;flex-direction:column;gap:12px;"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;"><h3 style="margin:0;font-size:15px;font-weight:600;color:#2B2221;">Shape</h3></div><div style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:10px;">
<sc-for list="{{shapes}}" as="p" hint-placeholder-count="6"><button onClick="{{p.pick}}" aria-pressed="{{p.on}}" style="display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px;min-height:44px;padding:14px 4px 10px;border:1px solid {{p.border}};border-radius:16px;background:{{p.tileBg}};cursor:pointer;color:#2B2221;font-size:12px;font-weight:500;"><span style="position:relative;display:block;width:36px;height:58px;border-radius:{{p.radius}};clip-path:{{p.clip}};background:{{p.bg}};box-shadow:inset 0 -2px 0 rgba(0,0,0,.08), inset 0 0 0 1px rgba(0,0,0,.06);overflow:hidden;"><span style="position:absolute;inset:0;display:block;background:{{p.shine}};"></span></span>{{p.name}}</button></sc-for>
</div></div><div style="display:flex;flex-direction:column;gap:12px;"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;"><h3 style="margin:0;font-size:15px;font-weight:600;color:#2B2221;">Length</h3></div><div style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:4px;padding:4px;border-radius:999px;background:#F1E8E2;">
<sc-for list="{{lengths}}" as="l" hint-placeholder-count="3"><button onClick="{{l.pick}}" aria-pressed="{{l.on}}" style="height:40px;border:0;border-radius:999px;background:{{l.bg}};color:{{l.fg}};font-size:14px;font-weight:600;cursor:pointer;">{{l.name}}</button></sc-for>
</div></div><div style="display:flex;flex-direction:column;gap:12px;"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;"><h3 style="margin:0;font-size:15px;font-weight:600;color:#2B2221;">Skin tone</h3></div><div style="display:grid;grid-template-columns:repeat(6, minmax(0, 1fr));gap:10px;">
<sc-for list="{{skins}}" as="c" hint-placeholder-count="6"><button onClick="{{c.pick}}" aria-label="{{c.label}}" aria-pressed="{{c.on}}" title="{{c.name}}" style="width:100%;aspect-ratio:1;min-height:44px;padding:0;border:0;border-radius:50%;background:{{c.hex}};box-shadow:{{c.ring}};cursor:pointer;"></button></sc-for>
</div></div></div></sc-if>
<sc-if value="{{isExtras}}" hint-placeholder-val="{{false}}"><div style="display:flex;flex-direction:column;gap:12px;"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;"><h3 style="margin:0;font-size:15px;font-weight:600;color:#2B2221;">Charms &amp; stickers</h3></div><p style="margin:0;font-size:13px;line-height:1.45;color:#6E5F5B;">Tip: switch to one nail first for a single accent charm.</p><div style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:10px;">
<sc-for list="{{stickers}}" as="s" hint-placeholder-count="6"><button onClick="{{s.pick}}" aria-pressed="{{s.on}}" style="display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px;min-height:44px;padding:14px 4px 10px;border:1px solid {{s.border}};border-radius:16px;background:{{s.tileBg}};cursor:pointer;color:#2B2221;font-size:12px;font-weight:500;"><span style="display:block;width:36px;height:36px;"><sc-if value="{{s.isNone}}" hint-placeholder-val="{{false}}"><svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="#6E5F5B" style="stroke-width:1.6;" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><line x1="6.5" y1="17.5" x2="17.5" y2="6.5"></line></svg></sc-if><sc-if value="{{s.isGem}}" hint-placeholder-val="{{false}}"><svg viewBox="0 0 24 24" width="100%" height="100%" aria-hidden="true"><polygon points="12,2 20,9 12,22 4,9" fill="#E6F4FF" stroke="#8DB6D1"></polygon><polygon points="12,2 15.5,9 12,22 8.5,9" fill="#FFFFFF"></polygon><polyline points="4,9 20,9" fill="none" stroke="#8DB6D1"></polyline></svg></sc-if>
<sc-if value="{{s.isStar}}" hint-placeholder-val="{{false}}"><svg viewBox="0 0 24 24" width="100%" height="100%" aria-hidden="true"><polygon points="12,2 14.9,8.6 22,9.3 16.6,14 18.2,21 12,17.3 5.8,21 7.4,14 2,9.3 9.1,8.6" fill="#EBC75E" stroke="#B48A26"></polygon></svg></sc-if>
<sc-if value="{{s.isHeart}}" hint-placeholder-val="{{false}}"><svg viewBox="0 0 24 24" width="100%" height="100%" aria-hidden="true"><path d="M12 21 C5 16.5 2 12.8 2 8.8 C2 5.6 4.5 3.5 7.2 3.5 C9.3 3.5 11 4.8 12 6.6 C13 4.8 14.7 3.5 16.8 3.5 C19.5 3.5 22 5.6 22 8.8 C22 12.8 19 16.5 12 21 Z" fill="#FFF6F4" stroke="#C9A7A0"></path></svg></sc-if>
<sc-if value="{{s.isFlower}}" hint-placeholder-val="{{false}}"><svg viewBox="0 0 24 24" width="100%" height="100%" aria-hidden="true"><circle cx="12" cy="6.5" r="4" fill="#FFFFFF" stroke="#E2D6D0"></circle><circle cx="17.2" cy="10.3" r="4" fill="#FFFFFF" stroke="#E2D6D0"></circle><circle cx="15.2" cy="16.4" r="4" fill="#FFFFFF" stroke="#E2D6D0"></circle><circle cx="8.8" cy="16.4" r="4" fill="#FFFFFF" stroke="#E2D6D0"></circle><circle cx="6.8" cy="10.3" r="4" fill="#FFFFFF" stroke="#E2D6D0"></circle><circle cx="12" cy="12" r="2.8" fill="#F2C14E"></circle></svg></sc-if>
<sc-if value="{{s.isPearls}}" hint-placeholder-val="{{false}}"><svg viewBox="0 0 24 24" width="100%" height="100%" aria-hidden="true"><circle cx="7.5" cy="6" r="3.6" fill="#FBF7EE" stroke="#D2C4AE"></circle><circle cx="12" cy="12.2" r="3.2" fill="#FBF7EE" stroke="#D2C4AE"></circle><circle cx="16.5" cy="18.2" r="2.8" fill="#FBF7EE" stroke="#D2C4AE"></circle></svg></sc-if></span>{{s.name}}</button></sc-for>
</div></div></sc-if>
<sc-if value="{{isLooks}}" hint-placeholder-val="{{false}}"><div style="display:flex;flex-direction:column;gap:12px;"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;"><h3 style="margin:0;font-size:15px;font-weight:600;color:#2B2221;">Saved looks</h3></div><div style="display:flex;flex-direction:column;gap:10px;"><sc-for list="{{looks}}" as="l" hint-placeholder-count="3"><button onClick="{{l.pick}}" style="flex-shrink:0;display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 16px 8px 12px;border:1px solid #E6DAD2;border-radius:16px;background:#FFFCFA;cursor:pointer;text-align:left;color:#2B2221;width:100%;">
<span style="display:flex;align-items:flex-end;gap:3px;"><sc-for list="{{l.nails}}" as="n" hint-placeholder-count="5"><span style="position:relative;display:block;width:10px;height:17px;border-radius:{{n.radius}};clip-path:{{n.clip}};background:{{n.bg}};box-shadow:inset 0 -2px 0 rgba(0,0,0,.08), inset 0 0 0 1px rgba(0,0,0,.06);overflow:hidden;"><span style="position:absolute;inset:0;display:block;background:{{n.shine}};"></span></span></sc-for></span>
<span style="display:flex;flex-direction:column;gap:2px;"><span style="font-size:14px;font-weight:600;">{{l.name}}</span><span style="font-size:12px;color:#6E5F5B;text-transform:capitalize;">{{l.meta}}</span></span>
</button></sc-for></div></div></sc-if>
</div>
<div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:10px;padding:12px 16px 20px;border-top:1px solid #EFE6DF;background:#FFFCFA;">
<button onClick="{{randomize}}" style="height:48px;padding:0 20px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;background:#FFFCFA;color:#2B2221;border:1px solid #DCCFC6;font-size:15px;font-weight:600;cursor:pointer;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width:2;stroke-linecap:round;stroke-linejoin:round;" aria-hidden="true"><path d="M16 3h5v5"></path><path d="M4 20 21 3"></path><path d="M21 16v5h-5"></path><path d="M15 15l6 6"></path><path d="M4 4l5 5"></path></svg>Surprise me</button>
<button onClick="{{save}}" style="height:48px;padding:0 20px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;background:{{accent}};color:#FFFFFF;border:1px solid {{accent}};font-size:15px;font-weight:600;cursor:pointer;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width:2;stroke-linecap:round;stroke-linejoin:round;" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>Save look</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#A63D57","options":["#A63D57","#2B2221","#1F6B52","#2448A6"]},"$preview":{"width":390,"height":844}}'>
const SCALE = 0.6;
const MOBILE = true;
const COLORS = [
  ['Cherry','#B3122E'],['Rosewood','#8E3B46'],['Blush','#E8A9A6'],['Ballet','#F2D4CF'],['Nude','#D9B39A'],['Mocha','#7B5544'],
  ['Coral','#F2735B'],['Tangerine','#F39A3B'],['Butter','#F4DC8A'],['Sage','#A7B99A'],['Emerald','#1F6B52'],['Sky','#9CC5E3'],
  ['Cobalt','#2448A6'],['Lilac','#C4A8E0'],['Plum','#5B2A58'],['Milk','#F7F3EE'],['Graphite','#4A4A4F'],['Onyx','#16151A']

  { name: 'Midnight Chrome', shape: 'coffin', length: 'long', nails: [nail('#2448A6', '#16151A', 'solid', 'chrome'), nail('#16151A', '#2448A6', 'solid', 'glitter', 'star'), nail('#2448A6', '#16151A', 'solid', 'chrome'), nail('#2448A6', '#16151A', 'solid', 'chrome'), nail('#2448A6', '#16151A', 'solid', 'chrome')] },

class Component extends DCLogic {
