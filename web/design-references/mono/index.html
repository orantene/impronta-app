<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<title>Mono · Pablo Serrano (DRAFT)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;800&family=Inter:wght@400;500;600&family=Geist:wght@500;600&display=swap">
<style>
.site{--k-fd:'Inter Tight',system-ui,sans-serif;--k-fb:'Inter',system-ui,sans-serif;--k-fdw:800;--k-fdls:-.03em;--k-rad:6px;--k-btnrad:6px;--k-dockrad:10px}
.mo-hdr{position:sticky;top:44px;z-index:6;display:flex;align-items:center;gap:10px;padding:12px 18px;background:var(--k-bg);border-bottom:1px solid var(--k-line)}
.mo-hdr b{font:800 15px var(--k-fd);letter-spacing:-.01em}
.mo-hdr .sp{flex:1}
.mo-hdr .k-btn{height:36px;padding:0 14px;display:none}
.mo-hero{padding:72px 20px 40px;text-align:center;display:grid;justify-items:center;gap:16px}
.mo-hero small{font:600 12px var(--k-fb);letter-spacing:.12em;text-transform:uppercase;color:var(--k-mute)}
.mo-hero h1{margin:0;font:800 48px/0.98 var(--k-fd);letter-spacing:-.03em;max-width:14ch}
.mo-hero h1 em{font-style:normal;color:var(--k-accent)}
.mo-hero p{margin:0;color:var(--k-mute);max-width:36ch;font-size:16px;line-height:1.5}
.mo-list{padding:24px 18px 0;max-width:760px;margin:0 auto}
.mo-list .hd{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.mo-list h2{margin:0;font:800 28px var(--k-fd);letter-spacing:-.02em}
.mo-list .hd small{font:600 12px var(--k-fb);letter-spacing:.12em;text-transform:uppercase;color:var(--k-mute)}
.mo-search{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border:1px solid var(--k-line);border-radius:var(--k-rad);color:var(--k-mute);font-size:15px;margin-bottom:12px}
.mo-pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:12px}
.mo-pills button{flex:none;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--k-line);background:var(--k-bg);color:var(--k-ink);font:500 13px var(--k-fb)}
.mo-pills button[aria-pressed=true]{background:var(--k-ink);color:var(--k-bg);border-color:var(--k-ink)}
.mo-row{display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:center;padding:14px 0;border-top:1px solid var(--k-line);cursor:pointer}
.mo-row:last-child{border-bottom:1px solid var(--k-line)}
.mo-row b{font:600 16px var(--k-fd)}
.mo-row small{grid-column:1;color:var(--k-mute);font-size:13px}
.mo-row .p{grid-row:1;grid-column:2;font:600 16px var(--k-fd);text-align:right}
.mo-row .k-btn{grid-row:2;grid-column:2;height:36px;padding:0 14px}
.mo-faq{padding:72px 18px 0;max-width:760px;margin:0 auto}
.mo-faq h2,.mo-about h2{margin:0 0 12px;font:800 28px var(--k-fd);letter-spacing:-.02em}
.mo-faq details{border-top:1px solid var(--k-line);padding:14px 0}
.mo-faq details:last-child{border-bottom:1px solid var(--k-line)}
.mo-faq summary{cursor:pointer;font:600 16px var(--k-fd)}
.mo-faq p{margin:8px 0 0;color:var(--k-mute)}
.mo-about{padding:72px 18px 0;max-width:760px;margin:0 auto}
.mo-about p{margin:0;font-size:16px;line-height:1.6}
.mo-end{margin:72px 18px 0;padding:22px 0 130px;border-top:1px solid var(--k-line);display:flex;justify-content:space-between;font:600 11px var(--k-fb);letter-spacing:.12em;text-transform:uppercase;color:var(--k-mute)}
.mo-pills{scrollbar-width:none}.mo-pills::-webkit-scrollbar{display:none}
@container site (min-width:900px){
  .mo-hdr{top:0;padding:16px 40px}
  .mo-hdr .k-btn{display:inline-flex}
  .mo-hero{padding:120px 40px 56px}
  .mo-hero h1{font-size:104px}
  .mo-list h2,.mo-faq h2,.mo-about h2{font-size:36px}
  .mo-row{grid-template-columns:1fr auto auto;gap:4px 24px;padding:18px 0}
  .mo-row .p{grid-column:2}
  .mo-row .k-btn{grid-row:1;grid-column:3}
  .mo-end{margin:96px auto 0;max-width:760px}
}
</style>
<script src="kit.js"></script>
