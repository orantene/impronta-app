<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Support Desk mockups — Phase 0.5</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f4f5;
        --fg: #18181b;
        --muted: #52525b;
        --line: #e4e4e7;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #18181b;
          --fg: #fafafa;
          --muted: #a1a1aa;
          --line: #3f3f46;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font: 15px/1.5 ui-sans-serif, system-ui, sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      main {
        max-width: 36rem;
        padding: 2rem;
        border: 1px solid var(--line);
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
      code {
        font-size: 0.9em;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Support Desk mockups</h1>
      <p>
        Placeholder for Phase 0.5 clickable HTML. Served at
        <code>http://127.0.0.1:3099/support-desk/</code>. Production Desk UI waits
        on Oran mockup OK.
      </p>
    </main>
  </body>
</html>
