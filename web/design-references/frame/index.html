<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<title>Frame · Tomás Aguilar (DRAFT)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=Geist:wght@500;600&display=swap">
<style>
.site{--k-fd:'Space Grotesk',system-ui,sans-serif;--k-fb:'Inter',system-ui,sans-serif;--k-fdw:600;--k-fdls:.02em;--k-rad:0px;--k-btnrad:0px;--k-dockrad:4px}
.fr-top{position:sticky;top:44px;z-index:6}
.fr-hdr{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--k-bg);border-bottom:1px solid var(--k-line)}
.fr-hdr b{font:700 13px var(--k-fd);letter-spacing:.08em;text-transform:uppercase}
.fr-hdr .sp{flex:1}
.fr-filter{display:flex;gap:4px;overflow-x:auto;padding:8px 16px;border-bottom:1px solid var(--k-line);background:var(--k-bg)}
.fr-filter a{flex:none;padding:6px 12px;border:1px solid var(--k-line);font:600 12px var(--k-fd);letter-spacing:.06em;text-transform:uppercase;color:var(--k-ink);text-decoration:none;cursor:pointer}
.fr-filter a:first-child{background:var(--k-ink);color:var(--k-bg);border-color:var(--k-ink)}
.fr-hero{display:grid;gap:0}
.fr-hero .ph{aspect-ratio:4/3;overflow:hidden;background:var(--k-tint)}
.fr-hero .ph img{width:100%;height:100%;object-fit:cover;display:block}
.fr-hero .tx{padding:22px 16px 8px;display:grid;gap:12px;align-content:end}
.fr-hero small{font:600 11px var(--k-fd);letter-spacing:.14em;text-transform:uppercase;color:var(--k-mute)}
.fr-hero h1{margin:0;font:600 40px/0.95 var(--k-fd);letter-spacing:.02em;text-transform:uppercase}
.fr-hero p{margin:0;color:var(--k-mute);max-width:40ch;line-height:1.5}
.fr-hero .row{display:flex;gap:8px;flex-wrap:wrap}
.fr-work{padding:40px 16px 0}
.fr-work .hd,.fr-svc .hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.fr-work h2,.fr-svc h2,.fr-end h2,.fr-about h2{margin:0;font:600 26px var(--k-fd);letter-spacing:.02em;text-transform:uppercase}
.fr-work .hd small,.fr-svc .hd small{font:600 11px var(--k-fd);letter-spacing:.12em;text-transform:uppercase;color:var(--k-mute)}
.fr-sheet{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}
.fr-sheet figure{margin:0}
.fr-sheet img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block}
.fr-sheet figcaption{padding:4px 0 8px;font:500 11px var(--k-fd);letter-spacing:.06em;text-transform:uppercase;color:var(--k-mute)}
.fr-svc{padding:56px 16px 0}
.fr-tabs{display:flex;gap:18px;border-bottom:1px solid var(--k-line);margin-bottom:12px}
.fr-tabs button{padding:10px 0;border:0;border-bottom:2px solid transparent;background:none;color:var(--k-mute);font:600 12px var(--k-fd);letter-spacing:.08em;text-transform:uppercase}
.fr-tabs button[aria-selected=true]{color:var(--k-ink);border-color:var(--k-ink)}
.fr-cards{display:grid;gap:12px}
.fr-card{border:1px solid var(--k-line);background:var(--k-surface);cursor:pointer;display:grid}
.fr-card img{width:100%;aspect-ratio:3/2;object-fit:cover;display:block}
.fr-card .b{padding:14px;display:grid;gap:6px}
.fr-card b{font:600 18px var(--k-fd);letter-spacing:.01em}
.fr-card p{margin:0;color:var(--k-mute);font-size:13.5px}
.fr-card .f{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px}
.fr-card .p{font:600 15px var(--k-fd)}
.fr-end{margin-top:56px;padding:40px 16px;background:var(--k-ink);color:var(--k-bg);display:grid;gap:12px}
.fr-end p{margin:0;opacity:.75}
.fr-end .k-btn{background:var(--k-bg);color:var(--k-ink);border-color:var(--k-bg);justify-self:start}
.fr-about{padding:48px 16px 130px;display:grid;gap:10px}
.fr-about p{margin:0;line-height:1.6;max-width:60ch}
.fr-about .fine{margin-top:18px;font:600 10.5px var(--k-fd);letter-spacing:.12em;text-transform:uppercase;color:var(--k-mute)}
.fr-filter{scrollbar-width:none}.fr-filter::-webkit-scrollbar{display:none}
@container site (min-width:900px){
  .fr-top{top:0}
  .fr-hdr{padding:14px 32px}
  .fr-filter{padding:10px 32px}
  .fr-hero{grid-template-columns:40fr 60fr;min-height:56vh}
  .fr-hero .ph{aspect-ratio:auto;order:2}
  .fr-hero .tx{padding:40px 32px}
  .fr-hero h1{font-size:72px}
  .fr-work{padding:56px 32px 0}
  .fr-sheet{grid-template-columns:repeat(4,1fr);gap:6px}
  .fr-svc{padding:80px 32px 0}
  .fr-cards{grid-template-columns:repeat(3,1fr);gap:16px}
  .fr-end{margin:80px 32px 0;padding:56px 40px;grid-template-columns:1fr auto;align-items:center}
  .fr-end h2{font-size:40px}
  .fr-about{padding:56px 32px 140px;grid-template-columns:320px 1fr;gap:40px}
}
</style>
<script src="kit.js"></script>
<script>

  id:'TH-FRAME', theme:'Frame', lang:'es', domain:'tomas-retratos.tulala.digital', galleryUrl:'',
  brief:'DRAFT for PM review (TUL-328). Work first: split hero, a dense contact sheet, services as cards. Reference demo: Tomás Aguilar, TAL-93009, portrait photographer; instant session + request brand portrait.',
  talent:{name:'Tomás Aguilar', first:'Tomás', role:'portrait photographer', avatar:'fr-hero', tagline:'Retratos con luz de estudio.', bio:'Fotógrafo de retrato en Guadalajara. Trabajo con luz de estudio y locación; te ayudo a posar y elegimos juntos las mejores tomas. Entrego en una semana.'},

    dark:{n:'Darkroom', bg:'#0E0E0E', surface:'#191919', ink:'#F2F2F2', mute:'#9C9C9C', line:'#2E2E2E', accent:'#E0B04A', on:'#0E0E0E', tint:'#202020', at:'#E0B04A'},
    film:{n:'Film & Amber', bg:'#FFFFFF', surface:'#F7F2EA', ink:'#221D16', mute:'#7A7062', line:'#E8DFD0', accent:'#8C5A14', on:'#FFFFFF', tint:'#F0E8DB', at:'#8C5A14'}
