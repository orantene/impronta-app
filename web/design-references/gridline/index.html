<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<title>Gridline Theme Review</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&family=JetBrains+Mono:wght@400;500;700&family=Geist:wght@500;600&family=Inter:wght@400;500;600&display=swap">
<style>
.site{--k-fd:'Archivo',system-ui,sans-serif;--k-fb:'Archivo',system-ui,sans-serif;--k-fdw:800;--k-fdls:-.02em;--k-rad:10px;--k-btnrad:6px;--k-dockrad:10px;--gm:'JetBrains Mono',ui-monospace,monospace}
.gl{padding-bottom:120px}
.gl-mono{font-family:var(--gm)}
.gl-top{position:sticky;top:44px;z-index:7;display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--k-ink);color:var(--k-bg)}
.gl-logo{width:34px;height:34px;border-radius:6px;background:var(--k-accent);color:var(--k-on);display:grid;place-items:center;flex:0 0 auto}
.gl-top .nm{flex:1;min-width:0;line-height:1.1}
.gl-top .nm b{display:block;font:800 14.5px var(--k-fd);font-stretch:112%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gl-top .nm small{font:500 10.5px var(--gm);opacity:.7;letter-spacing:.02em}
.gl-top .k-demo{border-color:color-mix(in srgb,var(--k-bg) 30%,transparent);color:color-mix(in srgb,var(--k-bg) 75%,transparent)}
.gl-urg{display:flex;align-items:center;gap:7px;min-height:44px;padding:0 10px 0 8px;border-radius:6px;border:1.5px solid color-mix(in srgb,var(--k-bg) 30%,transparent);background:none;color:var(--k-bg);font:700 12.5px var(--k-fb)}
.gl-urg i{width:30px;height:18px;border-radius:9px;background:color-mix(in srgb,var(--k-bg) 25%,transparent);position:relative;flex:0 0 auto}
.gl-urg i::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--k-bg);transition:left .15s}
.gl-urg[data-on="true"]{background:var(--k-accent);color:var(--k-on);border-color:var(--k-accent)}
.gl-urg[data-on="true"] i{background:color-mix(in srgb,var(--k-on) 35%,transparent)}
.gl-urg[data-on="true"] i::after{left:14px;background:var(--k-on)}
.gl-tel{width:44px;height:44px;border-radius:6px;border:0;background:var(--k-bg);color:var(--k-ink);display:grid;place-items:center;flex:0 0 auto}
.gl-top .k-btn{display:none}
/* hero spec block */
.gl-hero{padding:18px 12px 0}
.gl-kick{display:flex;align-items:center;gap:8px;font:500 11.5px var(--gm);color:var(--k-mute);letter-spacing:.02em}
.gl-kick i{width:8px;height:8px;border-radius:50%;background:#2FA36B;box-shadow:0 0 0 3px color-mix(in srgb,#2FA36B 25%,transparent)}
.gl-h1{margin:10px 0 0;font:850 34px/1 var(--k-fd);font-stretch:118%;letter-spacing:-.03em;text-wrap:balance}
.gl-h1 em{font-style:normal;background:var(--k-accent);color:var(--k-on);padding:0 .12em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.gl-spec{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--k-ink);border-radius:var(--k-rad);overflow:hidden;background:var(--k-surface)}
.gl-spec div{padding:11px 12px;border-right:1.5px solid var(--k-ink);border-bottom:1.5px solid var(--k-ink)}
.gl-spec div:nth-child(2n){border-right:0}.gl-spec div:nth-last-child(-n+2){border-bottom:0}
.gl-spec small{display:block;font:500 10.5px var(--gm);letter-spacing:.06em;text-transform:uppercase;color:var(--k-mute)}
.gl-spec b{display:block;margin-top:4px;font:800 19px/1.1 var(--k-fd);font-stretch:110%}
.gl-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.gl-acts .k-btn{padding:0 10px;font-weight:700;min-height:50px}
.gl-who{display:grid;grid-template-columns:92px 1fr;gap:12px;align-items:center;margin-top:14px;padding:10px;border-radius:var(--k-rad);background:var(--k-surface);border:1px solid var(--k-line)}
.gl-who img{width:92px;height:92px;object-fit:cover;object-position:50% 20%;border-radius:6px}
.gl-who p{margin:0;font-size:14px;line-height:1.45;color:var(--k-mute)}
.gl-who b{display:block;color:var(--k-ink);font:800 16px var(--k-fd);margin-bottom:3px}
.gl-badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.gl-badges span{font:500 11px var(--gm);padding:5px 8px;border:1px solid var(--k-line);border-radius:4px;background:var(--k-surface)}
/* urgent band */
.gl-emg{margin:16px 12px 0;border-radius:var(--k-rad);overflow:hidden;border:2px solid var(--k-ink);background:var(--k-surface)}
.gl-emg .tape{height:18px;background:repeating-linear-gradient(-45deg,var(--k-accent) 0 12px,var(--k-ink) 12px 24px)}
.gl-emg .in{padding:14px}
.gl-emg h2{margin:0;font:850 26px/1 var(--k-fd);font-stretch:118%}
.gl-emg p{margin:8px 0 12px;font-size:14.5px;color:var(--k-mute)}
.gl-emg .safe{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:13px;background:var(--k-bg);border-radius:8px;padding:10px;margin-bottom:12px}
.gl-emg .k-btn{width:100%;font-weight:700}
/* sections */
.gl-sec{padding:40px 12px 0}
.gl-hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px;padding-bottom:8px;border-bottom:1.5px solid var(--k-ink)}
.gl-hd h2{margin:0;font:850 25px/1 var(--k-fd);font-stretch:118%;letter-spacing:-.02em}
.gl-hd small{font:500 11px var(--gm);color:var(--k-mute);text-align:right}
/* task picker */
.gl-tasks{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.gl-task{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:center;text-align:left;min-height:60px;padding:10px;border-radius:8px;border:1.5px solid var(--k-line);background:var(--k-surface);color:var(--k-ink);font:700 13.5px/1.2 var(--k-fb)}
.gl-task svg{color:var(--k-mute)}
.gl-task[aria-pressed="true"]{border-color:var(--k-ink);background:var(--k-ink);color:var(--k-bg)}
.gl-task[aria-pressed="true"] svg{color:var(--k-accent)}
.gl-rec{margin-top:8px;border:1.5px solid var(--k-ink);border-radius:var(--k-rad);background:var(--k-surface);overflow:hidden}
.gl-rec .h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;background:var(--k-accent);color:var(--k-on);font:700 11px var(--gm);letter-spacing:.06em;text-transform:uppercase}
.gl-rec .b{padding:12px;display:grid;gap:10px}
.gl-rec h3{margin:0;font:850 22px/1.05 var(--k-fd);font-stretch:112%}
.gl-rec p{margin:0;font-size:14px;color:var(--k-mute)}
.gl-rec dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font:500 12.5px var(--gm)}
.gl-rec dt{color:var(--k-mute)}.gl-rec dd{margin:0;text-align:right;font-weight:700}
.gl-rec .row{display:flex;gap:8px}.gl-rec .row .k-btn{flex:1;font-weight:700}
.gl-rec .row .k-btn.ghost{flex:0 0 auto}
.gl-empty{margin-top:8px;padding:14px;border:1.5px dashed var(--k-line);border-radius:var(--k-rad);font:500 12.5px var(--gm);color:var(--k-mute)}
/* comparison matrix */
.gl-mx{overflow-x:auto;margin:0 -12px;padding:0 12px 4px;scrollbar-width:thin}
.gl-mx table{border-collapse:separate;border-spacing:0;min-width:640px;width:100%;font-size:13px;background:var(--k-surface);border:1.5px solid var(--k-ink);border-radius:var(--k-rad);overflow:hidden}
.gl-mx th,.gl-mx td{padding:10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--k-line)}
.gl-mx tr:last-child td,.gl-mx tr:last-child th{border-bottom:0}
.gl-mx thead th{background:var(--k-ink);color:var(--k-bg);font:800 14px/1.15 var(--k-fd);font-stretch:108%;cursor:pointer}
.gl-mx thead th:first-child{background:var(--k-ink)}
.gl-mx tbody th{position:sticky;left:0;background:var(--k-surface);font:500 10.5px var(--gm);letter-spacing:.05em;text-transform:uppercase;color:var(--k-mute);width:110px;border-right:1px solid var(--k-line);z-index:1}
.gl-mx td b{font:800 16px var(--k-fd)}
.gl-mx .y{color:#1E7A4F;font-weight:700}.gl-mx .n{color:var(--k-mute)}
.gl-mx td .k-btn{min-height:44px;padding:0 12px;font-size:13.5px;font-weight:700;width:100%}
.gl-mx .urg td.e,.gl-mx .urg th.e{background:color-mix(in srgb,var(--k-accent) 18%,var(--k-surface))}
.gl-mx thead th.e{background:var(--k-accent)!important;color:var(--k-on)}
.gl-mx{display:none}
.gl-cards{display:grid;gap:8px}
.gl-mc{background:var(--k-surface);border:1.5px solid var(--k-ink);border-radius:var(--k-rad);overflow:hidden;display:grid}
.gl-mc.e{border-color:var(--k-accent);box-shadow:0 0 0 2px var(--k-accent)}
.gl-mc .h{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:52px;padding:10px 12px;border:0;background:var(--k-ink);color:var(--k-bg);text-align:left;font:800 16px/1.15 var(--k-fd)}
.gl-mc.e .h{background:var(--k-accent);color:var(--k-on)}
.gl-mc .h span{font:700 13px var(--gm);white-space:nowrap}
.gl-mc dl{margin:0;padding:6px 12px;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13.5px}
.gl-mc dt{font:500 10.5px var(--gm);letter-spacing:.05em;text-transform:uppercase;color:var(--k-mute);padding-top:2px}
.gl-mc dd{margin:0;text-align:right}
.gl-mc .k-btn{margin:4px 12px 12px;font-weight:700}
.gl-hint{font:500 11px var(--gm);color:var(--k-mute);margin-top:8px}
/* spec table + jobs */
.gl-st{width:100%;border-collapse:collapse;font-size:14px;background:var(--k-surface);border:1.5px solid var(--k-ink);border-radius:var(--k-rad);overflow:hidden}
.gl-st th,.gl-st td{padding:11px 12px;border-bottom:1px solid var(--k-line);text-align:left;vertical-align:top}
.gl-st th{font:500 11px var(--gm);letter-spacing:.05em;text-transform:uppercase;color:var(--k-mute);width:38%}
.gl-st td{font-weight:600}
.gl-st tr:last-child th,.gl-st tr:last-child td{border-bottom:0}
.gl-jobs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.gl-job{margin:0;border-radius:8px;overflow:hidden;background:var(--k-surface);border:1px solid var(--k-line)}
.gl-job img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.gl-job figcaption{padding:8px;font:500 10.5px/1.4 var(--gm);color:var(--k-mute)}
.gl-job figcaption b{display:block;color:var(--k-ink);font:800 13px var(--k-fd);margin-bottom:2px}
/* coverage */
.gl-area{display:grid;gap:10px;background:var(--k-surface);border:1.5px solid var(--k-ink);border-radius:var(--k-rad);padding:12px}
.gl-area svg{width:100%;height:auto;display:block;border-radius:6px;background:var(--k-bg)}
.gl-area ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.gl-area li{font:500 12px var(--gm);padding:6px 9px;border-radius:4px;background:var(--k-bg)}
.gl-area p{margin:0;font-size:13px;color:var(--k-mute)}
/* faq */
.gl-faq details{border-bottom:1px solid var(--k-line)}
.gl-faq summary{list-style:none;cursor:pointer;min-height:52px;display:flex;align-items:center;justify-content:space-between;gap:10px;font:700 15px var(--k-fb)}
.gl-faq summary::-webkit-details-marker{display:none}
.gl-faq summary::after{content:'+';font:500 20px var(--gm)}
.gl-faq details[open] summary::after{content:'−'}
.gl-faq p{margin:0 0 14px;font-size:14px;color:var(--k-mute)}
.gl-foot{padding:26px 12px 0;display:flex;justify-content:space-between;font:500 11px var(--gm);color:var(--k-mute)}
.site .k-sheet .k-t,.site .k-res h2{font-stretch:115%}
@container site (max-width:370px){.gl-h1{font-size:29px}.gl-top .nm small{display:none}.gl-urg span{display:none}.gl-tasks{grid-template-columns:1fr}.gl-acts{grid-template-columns:1fr}}
@container site (min-width:900px){
  .gl-top{top:0;padding:10px 40px;gap:14px}
  .gl-top .k-btn{display:inline-flex;min-height:44px;font-weight:700}
  .gl-hero{padding:48px 40px 0;display:grid;grid-template-columns:1.25fr 1fr;gap:36px;align-items:start}
  .gl-h1{font-size:64px}
  .gl-spec{grid-template-columns:repeat(4,1fr)}
  .gl-spec div{border-bottom:0!important}.gl-spec div:nth-child(2n){border-right:1.5px solid var(--k-ink)}.gl-spec div:last-child{border-right:0}
  .gl-spec b{font-size:22px}
  .gl-acts{display:flex}.gl-acts .k-btn{padding:0 26px}
  .gl-who{grid-template-columns:1fr;padding:0;overflow:hidden}
  .gl-who img{width:100%;height:340px;border-radius:0}
  .gl-who>div{padding:0 16px 16px}
  .gl-emg{margin:28px 40px 0;display:grid;grid-template-columns:18px 1fr}
  .gl-emg .tape{height:auto;background:repeating-linear-gradient(-45deg,var(--k-accent) 0 12px,var(--k-ink) 12px 24px)}
  .gl-emg .in{display:grid;grid-template-columns:1fr 1fr auto;gap:24px;align-items:center;padding:20px 24px}
  .gl-emg .safe,.gl-emg p{margin:0}
  .gl-sec{padding:72px 40px 0}
  .gl-hd h2{font-size:40px}
  .gl-pick{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;align-items:start}
  .gl-tasks{grid-template-columns:repeat(3,1fr);gap:8px}
  .gl-task{min-height:84px;align-items:start}
  .gl-rec,.gl-empty{margin-top:0}
  .gl-mx{display:block;margin:0;padding:0;overflow:visible}
  .gl-cards{display:none}
  .gl-mx table{min-width:0}
  .gl-mx tbody th{width:180px}
  .gl-proof{display:grid;grid-template-columns:1fr 1.2fr;gap:24px;align-items:start}
  .gl-jobs{margin-top:0;grid-template-columns:repeat(3,1fr);gap:8px}
  .gl-two{display:grid;grid-template-columns:1fr 1fr;gap:40px}
  .gl-two .gl-sec{padding-left:0;padding-right:0}
  .gl-wrap2{padding:0 40px}
  .gl-foot{padding:34px 40px 0}
}

/* ── refinement pass 2026-10-01 ── */
.gl-top{gap:10px;padding:10px 12px;border-bottom:1px solid color-mix(in srgb,var(--k-bg) 10%,transparent)}
.gl-top .nm b{font-size:15px;font-stretch:108%}
.gl-top .nm small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.gl-top .k-demo{display:none}
.gl-urg{min-height:36px;padding:0 12px;border-radius:99px;border:0;gap:8px;font:700 12px var(--k-fb);background:color-mix(in srgb,var(--k-bg) 10%,transparent);color:var(--k-bg);white-space:nowrap}
.gl-urg i{width:8px;height:8px;border-radius:50%;background:color-mix(in srgb,var(--k-bg) 45%,transparent)}
.gl-urg i::after{display:none}
.gl-urg[data-on="true"]{background:color-mix(in srgb,var(--k-accent) 16%,transparent);color:var(--k-accent)}
.gl-urg[data-on="true"] i{background:var(--k-accent);box-shadow:0 0 0 0 var(--k-accent);animation:glPulse 1.8s infinite}
@keyframes glPulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--k-accent) 60%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.gl-urg i{animation:none!important}}
.gl-tel{width:40px;height:40px;border-radius:99px;background:none;color:var(--k-bg);border:1.5px solid color-mix(in srgb,var(--k-bg) 28%,transparent)}
.gl-logo{width:36px;height:36px;border-radius:8px}
.gl-h1{line-height:1.14}
.gl-h1 em{background:linear-gradient(transparent 18%,var(--k-accent) 18%,var(--k-accent) 90%,transparent 90%);padding:0 .06em;margin:0 -.06em}
.gl-spec b{font-size:17px}
.gl-emg{margin:12px 12px 0;border-width:1.5px}
.gl-emg .tape{height:8px}
.gl-emg .in{padding:14px 14px 14px}
.gl-emg h2{font-size:21px;font-stretch:112%}
.gl-emg p{font-size:13.5px;margin:6px 0 10px}
.gl-emg .safe{font-size:12.5px;padding:9px 10px}
.gl-who{grid-template-columns:64px 1fr;align-items:start}
.gl-who img{width:64px;height:64px;border-radius:50%}
.gl-rec0 .h{background:var(--k-ink);color:var(--k-bg)}
.gl-task{transition:border-color .15s,transform .15s}
.gl-task:hover{border-color:var(--k-ink);transform:translateY(-1px)}
.gl-job{transition:transform .18s}
.gl-job:hover{transform:translateY(-2px)}
.gl-hd{border-bottom-width:2px}
@container site (max-width:370px){.gl-urg{padding:0 10px}}
@container site (min-width:900px){
  .gl-top{padding:12px 40px}
  .gl-top .k-demo{display:none}
  .gl-top .k-btn{min-height:40px;padding:0 18px}
  .gl-h1{font-size:60px;line-height:1.12}
  .gl-spec b{font-size:20px}
  .gl-emg{margin:24px 40px 0;grid-template-columns:10px 1fr}
  .gl-emg .tape{height:auto}
  .gl-emg .in{grid-template-columns:1.1fr 1fr auto;padding:16px 22px;gap:22px}
  .gl-emg h2{font-size:22px}
  .gl-who img{width:100%;height:340px;border-radius:0}
  .gl-who{grid-template-columns:1fr}
  .gl-proof{grid-template-columns:1fr;gap:12px}
  .gl-st{display:grid;grid-template-columns:repeat(5,1fr)}
  .gl-st tbody{display:contents}
  .gl-st tr{display:grid;border-right:1px solid var(--k-line)}
  .gl-st tr:last-child{border-right:0}
  .gl-st th,.gl-st td{width:auto;border-bottom:0;padding:12px 14px 4px}
  .gl-st td{padding:0 14px 14px;font-size:14px}
  .gl-jobs{grid-template-columns:repeat(6,1fr)}
  .gl-job img{aspect-ratio:4/5}
}
</style>
<script src="kit.js"></script>
<script>
/* Theme state: urgency mode + selected task (task picker = a W-11 variant mapping tasks to services). */
const GL = {urg:true, task:null}; /* urg = the talent's own 'Atiendo emergencias hoy' setting, shown as state */
const GL_IC = {
  dark:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/><path d="M4 4l16 16"/></svg>',
  lamp:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v6M6 14a6 6 0 0 1 12 0zM10 18a2 2 0 0 0 4 0"/></svg>',
  trip:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h2v8H9zM13 8h2v4h-2z"/></svg>',
  panel:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 7h4M7 11h4M7 15h4M13 7h4M13 11h4M13 15h4"/></svg>',
  plug:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M10 9v2M14 9v2M9 15h6"/></svg>',
